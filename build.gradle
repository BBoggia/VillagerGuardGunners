buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def phase8PerformanceEnabled = providers.gradleProperty('phase8Performance')
        .map { it.toBoolean() }
        .orElse(false)
def phase8PerformanceReportDirectory = layout.buildDirectory.dir('reports/phase8-performance')
def releaseCandidateEvidenceDirectory = layout.buildDirectory.dir('reports/release-candidate')
def curseForgeReleaseDirectory = layout.buildDirectory.dir(
        "distributions/curseforge/${mod_version}")
def generatedGameTestArenaDirectory = layout.buildDirectory.dir('generated/gametest-arena')
def phase8ArtifactSha256Property = 'villagerguardgunners.phase8ProductionArtifactSha256'
def sha256OfFile = { File file ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(file.bytes)
            .collect { String.format('%02x', it & 0xff) }
            .join()
}

sourceSets {
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        resources.srcDir generatedGameTestArenaDirectory
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    performanceGameTest {
        java.srcDir 'src/perftest/java'
        resources.srcDir 'src/perftest/resources'
        resources.srcDir generatedGameTestArenaDirectory
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('generateIsolatedGameTestArena') {
    description = 'Generates the padded development-only structure used to isolate GameTest fixtures.'
    File arena = generatedGameTestArenaDirectory.get().file(
            'data/minecraft/structures/villagerguardgunners/gametest_arena.nbt').asFile
    outputs.file arena
    doLast {
        arena.parentFile.mkdirs()
        arena.bytes = Base64.decoder.decode(
                '')
    }
}

tasks.named('processGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

tasks.named('processPerformanceGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    performanceGameTestImplementation.extendsFrom implementation
    performanceGameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run')
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run-gametest')
            if (phase8PerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces', "${mod_id}_performance,minecraft"
                property 'villagerguardgunners.phase8PerformanceReportDir',
                        phase8PerformanceReportDirectory.get().asFile.absolutePath
            }
            mods {
                "${mod_id}" {
                    source phase8PerformanceEnabled.get()
                            ? sourceSets.performanceGameTest
                            : sourceSets.gameTest
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'FzzyMaven'
        url = 'https://maven.fzzyhmstrs.me/'
        content {
            includeGroup 'me.fzzyhmstrs'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:guard-villagers:${guard_villager_version}")
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    implementation fg.deobf("me.fzzyhmstrs:fzzy_config:${fzzy_config_version}+forge")
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'villagerguardgunners.projectDir', project.layout.projectDirectory.asFile.absolutePath
    // Several contracts intentionally inspect production/test sources and
    // release documentation as text. Declare those external reads so Gradle
    // cannot reuse a stale green test result after one of them changes.
    inputs.files(
            fileTree('src/main'),
            fileTree('src/gametest'),
            fileTree('src/perftest'),
            fileTree('docs'),
            files(
                    'build.gradle',
                    'gradle.properties',
                    'README.md',
                    'CHANGELOG.md',
                    '.github/workflows/ci.yml'))
}

tasks.named('check').configure {
    dependsOn tasks.named('compileGameTestJava'), tasks.named('compilePerformanceGameTestJava')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'           : "mixins.${mod_id}.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies that the reobfuscated release JAR contains only the supported add-on surface.'
    dependsOn tasks.named('test'),
            tasks.named('compileGameTestJava'),
            tasks.named('compilePerformanceGameTestJava'),
            tasks.named('reobfJar')

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR was not created: ${archive}")
        }

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(archive)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set
            List<String> requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'mixins.villagerguardgunners.json',
                    'villagerguardgunners.refmap.json',
                    'assets/villagerguardgunners/textures/gui/gunner_inventory.png',
                    'assets/villagerguardgunners/lang/en_us.json',
                    'assets/villagerguardgunners/models/item/orders_ledger.json',
                    'data/villagerguardgunners/recipes/orders_ledger.json',
                    'data/villagerguardgunners/natural_guard_loadouts/easy.json',
                    'data/villagerguardgunners/natural_guard_loadouts/normal.json',
                    'data/villagerguardgunners/natural_guard_loadouts/hard.json',
                    'data/villagerguardgunners/tags/entity_types/guard_allies.json',
                    'data/villagerguardgunners/tags/entity_types/always_engage.json',
                    'data/villagerguardgunners/tags/entity_types/never_engage.json',
                    'com/gamergaming/villagerguardgunners/VillagerGuardGunners.class',
                    'com/gamergaming/villagerguardgunners/ammunition/AmmoCompatibility.class',
                    'com/gamergaming/villagerguardgunners/ammunition/GuardDroppedAmmoPickup.class',
                    'com/gamergaming/villagerguardgunners/ammunition/GuardAmmoMaintenance.class',
                    'com/gamergaming/villagerguardgunners/ammunition/GuardAmmoSharing.class',
                    'com/gamergaming/villagerguardgunners/ammunition/GuardAmmoSummary.class',
                    'com/gamergaming/villagerguardgunners/ammunition/GuardAmmoTransactions.class',
                    'com/gamergaming/villagerguardgunners/config/VillagerGuardGunnersConfig.class',
                    'com/gamergaming/villagerguardgunners/init/ModConfigs.class',
                    'com/gamergaming/villagerguardgunners/init/ModItems.class',
                    'com/gamergaming/villagerguardgunners/item/OrdersLedgerItem.class',
                    'com/gamergaming/villagerguardgunners/api/GuardNaturalLoadoutAccess.class',
                    'com/gamergaming/villagerguardgunners/orders/GuardOrderPermissions.class',
                    'com/gamergaming/villagerguardgunners/orders/GuardOrderTemplate.class',
                    'com/gamergaming/villagerguardgunners/orders/GuardOrderTemplateInteractions.class',
                    'com/gamergaming/villagerguardgunners/orders/GuardOrderTemplateService.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutPool.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutPools.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutDiagnostics.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutIssuance.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutProvenance.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutProvenanceCodec.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardLoadoutSelector.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardSpawnIntegration.class',
                    'com/gamergaming/villagerguardgunners/spawn/NaturalGuardSpawnRules.class',
                    'com/gamergaming/villagerguardgunners/ai/GuardGunCombatGoal.class',
                    'com/gamergaming/villagerguardgunners/api/GuardAllyProtection.class',
                    'com/gamergaming/villagerguardgunners/command/GuardGunnerCommands.class',
                    'com/gamergaming/villagerguardgunners/combat/NativeGunController.class',
                    'com/gamergaming/villagerguardgunners/combat/engagement/EngagementMode.class',
                    'com/gamergaming/villagerguardgunners/combat/engagement/GuardRulesOfEngagement.class',
                    'com/gamergaming/villagerguardgunners/combat/tactics/TacticalEnvelope.class',
                    'com/gamergaming/villagerguardgunners/combat/tactics/TacticalProfile.class',
                    'com/gamergaming/villagerguardgunners/combat/tactics/WeaponTacticalResolver.class',
                    'com/gamergaming/villagerguardgunners/mixin/GuardMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/ItemEntityMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/RaiseShieldGoalMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/VillagerToGuardMixin.class'
            ]
            List<String> missing = requiredEntries.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missing}")
            }

            List<String> prohibitedMarkers = [
                    '/gametest/',
                    'GuardBullet',
                    'GunMechanicsHandler',
                    'FireModeStrategy',
                    'GuardBehaviorTree',
                    'GuardReloadingGoal',
                    '.DS_Store'
            ]
            Set<String> prohibitedEntries = entries.findAll { entry ->
                prohibitedMarkers.any { marker -> entry.toLowerCase().contains(marker.toLowerCase()) }
            }
            if (!prohibitedEntries.isEmpty()) {
                throw new GradleException("Release JAR contains development or legacy entries: ${prohibitedEntries}")
            }

            Closure<String> readEntry = { String name ->
                new String(zip.getInputStream(zip.getEntry(name)).readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            }
            String manifest = readEntry('META-INF/MANIFEST.MF')
            if (!manifest.contains("Implementation-Version: ${project.version}")
                    || !manifest.contains('MixinConfigs: mixins.villagerguardgunners.json')
                    || manifest.contains('Implementation-Timestamp')) {
                throw new GradleException('Release manifest version, mixin, or reproducibility contract failed')
            }

            String metadata = readEntry('META-INF/mods.toml')
            Map<String, String> dependencyVersions = [
                    forge          : forge_version_range,
                    minecraft      : minecraft_version_range,
                    guardvillagers : "[1.20.1-${guard_villager_version}]",
                    tacz           : "[${tacz_version}]",
                    fzzy_config    : fzzy_config_version_range,
                    kotlinforforge : kotlin_for_forge_version_range
            ]
            dependencyVersions.each { dependencyId, versionRange ->
                if (!metadata.contains("modId=\"${dependencyId}\"")
                        || !metadata.contains("versionRange=\"${versionRange}\"")) {
                    throw new GradleException("Release metadata lost the exact ${dependencyId} dependency range")
                }
            }
            if (metadata.count('[[dependencies.villagerguardgunners]]') != dependencyVersions.size()) {
                throw new GradleException('Release metadata contains an unexpected dependency surface')
            }

            String refmap = readEntry('villagerguardgunners.refmap.json')
            if (refmap.trim().isEmpty()
                    || !refmap.contains('mixin/GuardMixin')
                    || !refmap.contains('mixin/ItemEntityMixin')
                    || !refmap.contains('mixin/RaiseShieldGoalMixin')
                    || !refmap.contains('mixin/VillagerToGuardMixin')) {
                throw new GradleException('Release mixin refmap is empty or missing common-server mappings')
            }

            Object mixinMetadata = new groovy.json.JsonSlurper().parseText(
                    readEntry('mixins.villagerguardgunners.json'))
            if (mixinMetadata.mixins != [
                        'GuardMixin',
                        'ItemEntityMixin',
                        'RaiseShieldGoalMixin',
                        'VillagerToGuardMixin'
                    ]
                    || mixinMetadata.client != [
                        'client.GuardModelMixin',
                        'client.GuardSteveModelMixin'
                    ]) {
                throw new GradleException(
                        'Release mixin metadata no longer isolates client-only model mixins')
            }

            String productionPackage = 'com/gamergaming/villagerguardgunners/'
            List<String> clientOnlyPrefixes = [
                    "${productionPackage}client/",
                    "${productionPackage}mixin/client/"
            ]
            Set<String> commonClassesWithClientReferences = entries.findAll { entry ->
                entry.startsWith(productionPackage)
                        && entry.endsWith('.class')
                        && !clientOnlyPrefixes.any { prefix -> entry.startsWith(prefix) }
                        && new String(
                                zip.getInputStream(zip.getEntry(entry)).readAllBytes(),
                                java.nio.charset.StandardCharsets.ISO_8859_1)
                                .contains('net/minecraft/client/')
            }
            if (!commonClassesWithClientReferences.isEmpty()) {
                throw new GradleException(
                        "Common-server classes contain client-only references: ${commonClassesWithClientReferences}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseArtifact')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    if (phase8PerformanceEnabled.get()) {
        dependsOn tasks.named('reobfJar')
    }
    doFirst {
        if (phase8PerformanceEnabled.get()) {
            File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
            if (!archive.isFile()) {
                throw new GradleException("Performance run production artifact is missing: ${archive}")
            }
            systemProperty phase8ArtifactSha256Property, sha256OfFile(archive)
            delete phase8PerformanceReportDirectory
            delete layout.projectDirectory.dir('run-phase8-performance/world')
            delete layout.projectDirectory.file(
                    'run-phase8-performance/config/villagerguardgunners/guard_gunners.toml')
            phase8PerformanceReportDirectory.get().asFile.mkdirs()
        } else {
            delete layout.projectDirectory.dir('run-gametest/world')
            delete layout.projectDirectory.file(
                    'run-gametest/config/villagerguardgunners/guard_gunners.toml')
        }
    }
}

