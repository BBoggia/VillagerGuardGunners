buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def phase8PerformanceEnabled = providers.gradleProperty('phase8Performance')
        .map { it.toBoolean() }
        .orElse(false)
def phase8PerformanceReportDirectory = layout.buildDirectory.dir('reports/phase8-performance')

sourceSets {
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.srcDir 'src/gametest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    performanceGameTest {
        java.srcDir 'src/perftest/java'
        resources.srcDir 'src/perftest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    performanceGameTestImplementation.extendsFrom implementation
    performanceGameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run')
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run-gametest')
            if (phase8PerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces', "${mod_id}_performance,minecraft"
                property 'villagerguardgunners.phase8PerformanceReportDir',
                        phase8PerformanceReportDirectory.get().asFile.absolutePath
            }
            mods {
                "${mod_id}" {
                    source phase8PerformanceEnabled.get()
                            ? sourceSets.performanceGameTest
                            : sourceSets.gameTest
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'FzzyMaven'
        url = 'https://maven.fzzyhmstrs.me/'
        content {
            includeGroup 'me.fzzyhmstrs'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:guard-villagers:${guard_villager_version}")
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    implementation fg.deobf("me.fzzyhmstrs:fzzy_config:${fzzy_config_version}+forge")
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'villagerguardgunners.projectDir', project.layout.projectDirectory.asFile.absolutePath
}

tasks.named('check').configure {
    dependsOn tasks.named('compileGameTestJava'), tasks.named('compilePerformanceGameTestJava')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'           : "mixins.${mod_id}.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies that the reobfuscated release JAR contains only the supported add-on surface.'
    dependsOn tasks.named('test'),
            tasks.named('compileGameTestJava'),
            tasks.named('compilePerformanceGameTestJava'),
            tasks.named('reobfJar')

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR was not created: ${archive}")
        }

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(archive)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set
            List<String> requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/mods.toml',
                    'mixins.villagerguardgunners.json',
                    'villagerguardgunners.refmap.json',
                    'assets/villagerguardgunners/textures/gui/gunner_inventory.png',
                    'com/gamergaming/villagerguardgunners/VillagerGuardGunners.class',
                    'com/gamergaming/villagerguardgunners/config/VillagerGuardGunnersConfig.class',
                    'com/gamergaming/villagerguardgunners/init/ModConfigs.class',
                    'com/gamergaming/villagerguardgunners/ai/GuardGunCombatGoal.class',
                    'com/gamergaming/villagerguardgunners/command/GuardGunnerCommands.class',
                    'com/gamergaming/villagerguardgunners/combat/NativeGunController.class',
                    'com/gamergaming/villagerguardgunners/mixin/GuardMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/RaiseShieldGoalMixin.class'
            ]
            List<String> missing = requiredEntries.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missing}")
            }

            List<String> prohibitedMarkers = [
                    '/gametest/',
                    'GuardBullet',
                    'GunMechanicsHandler',
                    'FireModeStrategy',
                    'GuardBehaviorTree',
                    'GuardReloadingGoal',
                    '.DS_Store'
            ]
            Set<String> prohibitedEntries = entries.findAll { entry ->
                prohibitedMarkers.any { marker -> entry.toLowerCase().contains(marker.toLowerCase()) }
            }
            if (!prohibitedEntries.isEmpty()) {
                throw new GradleException("Release JAR contains development or legacy entries: ${prohibitedEntries}")
            }

            Closure<String> readEntry = { String name ->
                new String(zip.getInputStream(zip.getEntry(name)).readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            }
            String manifest = readEntry('META-INF/MANIFEST.MF')
            if (!manifest.contains("Implementation-Version: ${project.version}")
                    || !manifest.contains('MixinConfigs: mixins.villagerguardgunners.json')
                    || manifest.contains('Implementation-Timestamp')) {
                throw new GradleException('Release manifest version, mixin, or reproducibility contract failed')
            }

            String metadata = readEntry('META-INF/mods.toml')
            Map<String, String> dependencyVersions = [
                    forge          : forge_version_range,
                    minecraft      : minecraft_version_range,
                    guardvillagers : "[1.20.1-${guard_villager_version}]",
                    tacz           : "[${tacz_version}]",
                    fzzy_config    : fzzy_config_version_range,
                    kotlinforforge : kotlin_for_forge_version_range
            ]
            dependencyVersions.each { dependencyId, versionRange ->
                if (!metadata.contains("modId=\"${dependencyId}\"")
                        || !metadata.contains("versionRange=\"${versionRange}\"")) {
                    throw new GradleException("Release metadata lost the exact ${dependencyId} dependency range")
                }
            }
            if (metadata.count('[[dependencies.villagerguardgunners]]') != dependencyVersions.size()) {
                throw new GradleException('Release metadata contains an unexpected dependency surface')
            }

            String refmap = readEntry('villagerguardgunners.refmap.json')
            if (refmap.trim().isEmpty()
                    || !refmap.contains('mixin/GuardMixin')
                    || !refmap.contains('mixin/RaiseShieldGoalMixin')) {
                throw new GradleException('Release mixin refmap is empty or missing common-server mappings')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseArtifact')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        if (phase8PerformanceEnabled.get()) {
            delete phase8PerformanceReportDirectory
            delete layout.projectDirectory.dir('run-phase8-performance/world')
            delete layout.projectDirectory.file(
                    'run-phase8-performance/config/villagerguardgunners/guard_gunners.toml')
            phase8PerformanceReportDirectory.get().asFile.mkdirs()
        } else {
            delete layout.projectDirectory.dir('run-gametest/world')
        }
    }
}

tasks.register('verifyPhase8PerformanceReports') {
    group = 'verification'
    description = 'Validates the complete output from the opt-in Phase 8 performance GameTest matrix.'

    doLast {
        File reportDirectory = phase8PerformanceReportDirectory.get().asFile
        Map<String, Integer> requiredScenarios = [
                'unarmed-idle-baseline-100': 0,
                'idle-armed-100'           : 0,
                'semi-10'                  : 1,
                'semi-25'                  : 1,
                'semi-50'                  : 1,
                'automatic-10'             : 1,
                'automatic-25'             : 1,
                'automatic-50'             : 1,
                'automatic-shotgun-10'     : 1,
                'explosive-10'             : 20,
                'obstacle-navigation-25'   : 0,
                'protected-crossing-25'    : 1
        ]
        Map<String, Object> expectedConfig = [
                'enabled'                                      : true,
                'combat.requiredVisibleTicks'                  : 5,
                'combat.maximumEngagementRange'                : 32.0D,
                'combat.closeRangeDistance'                    : 4.0D,
                'combat.aimToleranceDegrees'                   : 10.0D,
                'movement.approachSpeed'                       : 1.0D,
                'movement.retreatSpeed'                        : 0.75D,
                'movement.repositionSpeed'                     : 0.75D,
                'movement.friendlyRepositionTicks'             : 20,
                'safety.baseClearance'                         : 0.75D,
                'performance.visibilitySampleIntervalTicks'    : 2,
                'performance.movementDecisionIntervalTicks'    : 5,
                'performance.pathRecalculationIntervalTicks'   : 20,
                'performance.gunDataRefreshIntervalTicks'      : 20,
                'performance.unsafeShotCacheTicks'             : 2,
                'performance.repositionProgressCheckTicks'     : 10
        ]
        if (!reportDirectory.isDirectory()) {
            throw new GradleException(
                    'Phase 8 performance reports are missing; run ./gradlew runGameTestServer -Pphase8Performance=true')
        }

        requiredScenarios.each { scenario, minimumAcceptedShotEvidence ->
            File reportFile = new File(reportDirectory, "${scenario}.json")
            File profileFile = new File(reportDirectory, "${scenario}.jfr")
            if (!reportFile.isFile() || !profileFile.isFile() || profileFile.length() == 0L) {
                throw new GradleException("Phase 8 scenario ${scenario} is missing its JSON report or JFR profile")
            }

            Object report = new groovy.json.JsonSlurper().parse(reportFile)
            if (report.scenario != scenario
                    || report.warmupTicks != 100
                    || report.sampleTicks != 1000
                    || report.configProfile != 'default-v1'
                    || report.configVersion != 1
                    || report.jfrProfile != "${scenario}.jfr"
                    || report.minimumAcceptedShotEvidence != minimumAcceptedShotEvidence
                    || report.absoluteTimingGateApplied != false) {
                throw new GradleException("Phase 8 scenario ${scenario} has invalid run metadata")
            }

            expectedConfig.each { path, expectedValue ->
                Object actualValue = path.tokenize('.').inject(report.guardGunnerConfig) {
                    Object current, String key -> current instanceof Map ? current[key] : null
                }
                boolean matches = expectedValue instanceof Number
                        ? actualValue instanceof Number
                            && Double.compare(
                                    ((Number) actualValue).doubleValue(),
                                    ((Number) expectedValue).doubleValue()) == 0
                        : actualValue == expectedValue
                if (!matches) {
                    throw new GradleException(
                            "Phase 8 scenario ${scenario} used ${path}=${actualValue}; "
                                    + "the default-v1 profile requires ${expectedValue}")
                }
            }

            List<String> timingFields = ['averageMspt', 'p50Mspt', 'p95Mspt', 'p99Mspt', 'maxMspt']
            timingFields.each { field ->
                Object value = report[field]
                if (!(value instanceof Number)
                        || !Double.isFinite(((Number) value).doubleValue())
                        || ((Number) value).doubleValue() < 0.0D) {
                    throw new GradleException("Phase 8 scenario ${scenario} has invalid ${field}")
                }
            }
            if (report.p50Mspt > report.p95Mspt
                    || report.p95Mspt > report.p99Mspt
                    || report.p99Mspt > report.maxMspt) {
                throw new GradleException("Phase 8 scenario ${scenario} has unordered timing percentiles")
            }

            int acceptedShotEvidence = Math.max(
                    ((Number) report.nativeTaCZShootCount).intValue(),
                    ((Number) report.nativeAmmoConsumed).intValue())
            if (acceptedShotEvidence < minimumAcceptedShotEvidence) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has ${acceptedShotEvidence} native shots; "
                                + "at least ${minimumAcceptedShotEvidence} are required")
            }
        }
    }
}
