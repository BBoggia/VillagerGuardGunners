// Opt-in evidence from the combined village/performance run; never reuse another artifact's report.
tasks.register('verifyQuartermasterPerformanceReport') {
    group = 'verification'
    description = 'Verifies item conservation and bounded work in the native Quartermaster workload.'
    dependsOn tasks.named('verifyReleaseArtifact')
    doLast {
        File directory = layout.buildDirectory.dir('reports/quartermaster-performance').get().asFile
        File reportFile = new File(directory, 'quartermaster-100.json')
        File profile = new File(directory, 'quartermaster-100.jfr')
        if (!reportFile.isFile() || !profile.isFile() || profile.length() == 0) {
            throw new GradleException('Run the combined performance matrix to generate Quartermaster evidence.')
        }
        def report = new groovy.json.JsonSlurper().parse(reportFile)
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (report.scenario != 'quartermaster-100' || report.stations != 100
                || report.sampleTicksPerStage != 200 || report.nativeInsertions != 20000
                || report.nativeExtractions != 20000 || report.perBlockTickers != 0
                || report.itemsConserved != true || report.forcedChunksBefore != report.forcedChunksAfter
                || report.productionArtifactSha256 != sha256OfFile(archive)
                || report.performanceHarnessSha256 != sha256OfFiles(performanceHarnessFiles)) {
            throw new GradleException('Quartermaster evidence failed its artifact or conservation gate.')
        }
        ['idle', 'active', 'transportBatch'].each { prefix ->
            def timings = ['P50Millis', 'P95Millis', 'P99Millis', 'MaxMillis'].collect { report[prefix + it] }
            if (timings.any { !(it instanceof Number) || !Double.isFinite(it.doubleValue()) || it < 0 }
                    || timings != timings.sort(false)) {
                throw new GradleException('Quartermaster timing evidence is invalid.')
            }
        }
    }
}


