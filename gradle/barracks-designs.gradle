    commandLine 'python3', 'tools/build_combined_building_packs.py'
}

// A review bundle is available before manual publication approval. The public
// upload task still requires the complete release matrices.
tasks.register('prepareReleaseCandidate', Sync) {
    group = 'distribution'
    description = 'Stages the tested mod, optional player packs, instructions, and checksums for release review.'
    dependsOn 'check', 'verifyPublicReleaseIdentity', 'combinedBuildingIntegration',
            'regionalBarracksIntegration', 'regionalArmoryIntegration',
            'regionalSentryPostIntegration', 'regionalWatchtowerIntegration',
            'regionalTrainingYardIntegration', 'customBarracksIntegration',
            'customArmoryIntegration', 'customSentryPostIntegration',
            'customWatchtowerIntegration', 'customTrainingYardIntegration', 'skyVillageIntegration'
    into layout.buildDirectory.dir("distributions/release-candidate/${mod_version}")
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from("docs/releases/${mod_version}.md") {
        rename { 'RELEASE-NOTES.md' }
        filter { line -> line.replace('](../', '](docs/') }
    }
    from('docs/curseforge-description.md') { rename { 'DESCRIPTION.md' } }
    from('LICENSE.txt', 'CREDITS.md', 'README.md', 'CHANGELOG.md')
    from('docs') {
        exclude '**/.DS_Store'
        into 'docs'
    }
    def playerPacks = ['villager-guard-gunners-village-buildings.zip']
    ['vanilla', 'ctov', 'tidal-towns', 'mmv', 'sky-villages'].each { provider ->
        playerPacks.add("villager-guard-gunners-all-buildings-${provider}.zip")
    }
    ['barracks', 'armories', 'sentry-posts', 'watchtowers', 'training-yards'].each { family ->
        ['vanilla', 'tidal-towns', 'mmv'].each { provider ->
            playerPacks.add("villager-guard-gunners-regional-${family}-${provider}.zip")
        }
        ['ctov', 'sky-villages'].each { provider ->
            playerPacks.add("villager-guard-gunners-${family}-${provider}.zip")
        }
    }
    from(layout.buildDirectory.dir('distributions')) {
        include playerPacks
        into 'optional-datapacks'
    }
    doLast {
        playerPacks.each { name ->
            File pack = new File(destinationDir, "optional-datapacks/${name}")
            if (!pack.isFile()) throw new GradleException("Missing player datapack: ${name}")
            new java.util.zip.ZipFile(pack).withCloseable { zip ->
                def metadata = zip.getEntry('pack.mcmeta')
                if (metadata == null) throw new GradleException("Missing pack.mcmeta: ${name}")
                def content = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadata))
                if (content.pack?.pack_format != 15) {
                    throw new GradleException("Wrong Minecraft datapack format: ${name}")
                }
            }
        }
        new File(destinationDir, 'CANDIDATE-STATUS.txt').text =
                'Prepared for review; public release approval remains pending.\n' +
                'The Gradle check and release identity gates passed when this bundle was staged.\n' +
                'Manual playthrough, multiplayer, upgrade, performance, and clean-checkout CI\n' +
                'require current evidence. See docs/release-checklist.md.\n' +
                'Use the universal building ZIP, or select provider-specific alternatives.\n'
        new File(destinationDir, 'INSTALL.txt').text =
                'Install the mod JAR and required dependencies on both client and server.\n' +
                'Optional ZIPs go in the world datapacks folder, not the mods folder.\n' +
                'Read docs/building-pack-installation.md before selecting packs.\n' +
                'Read RELEASE-NOTES.md for dependencies, feature setup, and updating.\n'
        def files = fileTree(destinationDir).files.findAll { it.name != 'SHA256SUMS.txt' }
                .sort { destinationDir.toPath().relativize(it.toPath()).toString() }
        new File(destinationDir, 'SHA256SUMS.txt').text = files.collect { artifact ->
            def hash = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes).encodeHex().toString()
            "${hash}  ${destinationDir.toPath().relativize(artifact.toPath())}"
        }.join('\n') + '\n'
    }
}
