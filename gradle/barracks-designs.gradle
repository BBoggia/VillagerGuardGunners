// Finished block prototypes remain separate from default village generation.
tasks.register('generateBarracksDesignPack') {
    group = 'village structures'
    description = 'Builds the compact and courtyard Plains Barracks preview datapack.'
    inputs.files('src/structureDesign/resources/barracks-layouts.json',
            'src/main/templates/villagerguardgunners/village_buildings.json',
            'gradle/village-building-layouts.gradle', 'gradle/village-building-templates.gradle',
            'gradle/barracks-designs.gradle')
    outputs.dir layout.buildDirectory.dir('generated/barracks-design-pack')
    doLast {
        def json = new groovy.json.JsonSlurper()
        Map source = json.parse(file('src/main/templates/villagerguardgunners/village_buildings.json')) as Map
        source.layoutVariants = json.parse(file('src/structureDesign/resources/barracks-layouts.json'))
        File generated = new File(temporaryDir, 'compiled')
        def jobs = generateVillageBuildingResources(source, generated)
        File staged = new File(temporaryDir, 'pack')
        project.delete(staged)
        staged.mkdirs()
        jobs.findAll { !it.legacy }.each { job ->
            ["data/villagerguardgunners/village_buildings/${job.entryPath}.json",
             "data/villagerguardgunners/structures/${job.templatePath}.nbt"].each { path ->
                File target = new File(staged, path)
                target.parentFile.mkdirs()
                target.bytes = new File(generated, path).bytes
            }
        }
        new File(staged, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson(
                [pack:[pack_format:15, description:'Villager Guard Gunners: Plains Barracks design previews']]) + '\n'
        project.sync {
            from staged
            into layout.buildDirectory.dir('generated/barracks-design-pack')
        }
    }
}

tasks.register('barracksDesignPack', Zip) {
    group = 'village structures'
    description = 'Packages the Barracks preview datapack for an isolated Minecraft world.'
    dependsOn tasks.named('generateBarracksDesignPack')
    from layout.buildDirectory.dir('generated/barracks-design-pack')
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = 'villager-guard-gunners-barracks-designs.zip'
}

