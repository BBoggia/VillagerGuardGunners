name: NeoForge development

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Java 21 production build and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build artifacts and run the complete test suite
        run: ./gradlew --no-daemon build stageCoreQaMods stageMultiplayerQaMods
      - name: Retain experimental development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-development-${{ github.sha }}
          path: |
            build/neoforge/libs/*.jar
            build/neoforge/core-qa/*.jar
            build/neoforge/multiplayer-qa/*.jar
            build/neoforge/reports/tests/test/**
            build/neoforge/distributions/companion-packs/**
          if-no-files-found: error
          retention-days: 7
