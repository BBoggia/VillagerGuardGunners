        String productionArtifactSha256 = sha256OfFile(archive)
        String performanceHarnessSha256 = sha256OfFiles(performanceHarnessFiles)
        Map<String, Object> parsedReports = [:]

        Set<String> jsonScenarios = reportDirectory.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.json') }
                .collect { it.name.substring(0, it.name.length() - '.json'.length()) } as Set
        Set<String> jfrScenarios = reportDirectory.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.jfr') }
                .collect { it.name.substring(0, it.name.length() - '.jfr'.length()) } as Set
        if (jsonScenarios != requiredScenarios.keySet() || jfrScenarios != requiredScenarios.keySet()) {
            throw new GradleException(
                    "Phase 8 reports contain a missing or unexpected scenario; "
                            + "JSON=${jsonScenarios.sort()}, JFR=${jfrScenarios.sort()}")
        }

        requiredScenarios.each { scenario, expectedScenario ->
            File reportFile = new File(reportDirectory, "${scenario}.json")
            File profileFile = new File(reportDirectory, "${scenario}.jfr")
            if (!reportFile.isFile() || !profileFile.isFile() || profileFile.length() == 0L) {
                throw new GradleException("Phase 8 scenario ${scenario} is missing its JSON report or JFR profile")
            }

            long jfrEventCount = 0L
            long executionSampleCount = 0L
            jdk.jfr.consumer.RecordingFile recordingFile = null
            try {
                recordingFile = new jdk.jfr.consumer.RecordingFile(profileFile.toPath())
                while (recordingFile.hasMoreEvents()) {
                    def event = recordingFile.readEvent()
                    jfrEventCount++
                    if (event.eventType.name == 'jdk.ExecutionSample') {
                        executionSampleCount++
                    }
                }
            } catch (Exception exception) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has an unreadable JFR profile",
                        exception)
            } finally {
                recordingFile?.close()
            }
            if (jfrEventCount == 0L || executionSampleCount == 0L) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} JFR has no events or execution samples")
            }

            Object report = new groovy.json.JsonSlurper().parse(reportFile)
            parsedReports[scenario] = report
            int minimumAcceptedShotEvidence = (int) expectedScenario.minimumShotEvidence
            boolean firingWorkload = expectedScenario.workload == 'clear_lanes'
                    || expectedScenario.workload == 'protected_lanes'
                    || expectedScenario.workload == 'dry_primary_sidearm_switch'
                    || expectedScenario.workload == 'mixed_explosive_standoff_sidearm'
            int minimumAcceptedFiringGuards = firingWorkload
                    ? (expectedScenario.workload == 'mixed_explosive_standoff_sidearm'
                            ? Math.max(1, (((int) expectedScenario.guards) * 7 + 9).intdiv(10))
                            : (int) expectedScenario.guards <= 10
                            ? Math.max(1, (((int) expectedScenario.guards) + 1).intdiv(2))
                            : Math.max(1, (((int) expectedScenario.guards) * 4 + 4).intdiv(5)))
                    : 0
            int minimumAcceptedPerActiveGuardShotEvidence = firingWorkload ? 1 : 0
            int minimumAmmoSharingAttempts =
                    (int) expectedScenario.getOrDefault('minimumAmmoSharingAttempts', 0)
            int minimumPersistentDroppedAmmo =
                    (int) expectedScenario.getOrDefault('minimumPersistentDroppedAmmo', 0)
            int expectedSidearmLoadouts =
                    (int) expectedScenario.getOrDefault('expectedSidearmLoadouts', 0)
            int minimumSidearmActive =
                    (int) expectedScenario.getOrDefault('minimumSidearmActive', 0)
            int maximumSidearmActive =
                    (int) expectedScenario.getOrDefault('maximumSidearmActive', 0)
            int sidearmActivationTriggerTick =
                    (int) expectedScenario.getOrDefault('sidearmActivationTriggerTick', -1)
            int expectedArmories =
                    (int) expectedScenario.getOrDefault('armories', 0)
            if (report.scenario != scenario
                    || report.guards != expectedScenario.guards
                    || report.weapon != expectedScenario.weapon
                    || report.workload != expectedScenario.workload
                    || report.armories != expectedArmories
                    || report.warmupTicks != 200
                    || report.sampleTicks != 1000
                    || report.configProfile != 'default-v21'
                    || report.configVersion != 21
                    || report.jfrProfile != "${scenario}.jfr"
                    || report.minimumAcceptedShotEvidence != minimumAcceptedShotEvidence
                    || report.minimumAcceptedFiringGuards != minimumAcceptedFiringGuards
                    || report.minimumAcceptedPerActiveGuardShotEvidence
                            != minimumAcceptedPerActiveGuardShotEvidence
                    || report.minimumAmmoSharingAttempts != minimumAmmoSharingAttempts
                    || report.minimumPersistentDroppedAmmo != minimumPersistentDroppedAmmo
                    || report.expectedSidearmLoadouts != expectedSidearmLoadouts
                    || report.minimumSidearmActiveGuards != minimumSidearmActive
                    || report.maximumSidearmActiveGuards != maximumSidearmActive
                    || report.sidearmActivationTriggerTick != sidearmActivationTriggerTick
                    || report.absoluteTimingGateApplied != false
                    || report.relativeTimingGateApplied != true
                    || report.productionArtifactSha256 != productionArtifactSha256
                    || report.performanceHarnessSha256 != performanceHarnessSha256) {
                throw new GradleException("Phase 8 scenario ${scenario} has invalid run metadata")
            }

            expectedConfig.each { path, expectedValue ->
                Object actualValue = path.tokenize('.').inject(report.guardGunnerConfig) {
                    Object current, String key -> current instanceof Map ? current[key] : null
                }
                boolean matches = expectedValue instanceof Number
                        ? actualValue instanceof Number
                            && Double.compare(
                                    ((Number) actualValue).doubleValue(),
                                    ((Number) expectedValue).doubleValue()) == 0
                        : actualValue == expectedValue
                if (!matches) {
                    throw new GradleException(
                            "Phase 8 scenario ${scenario} used ${path}=${actualValue}; "
                                    + "the default-v21 profile requires ${expectedValue}")
                }
            }

            List<String> timingFields = ['averageMspt', 'p50Mspt', 'p95Mspt', 'p99Mspt', 'maxMspt']
            timingFields.each { field ->
                Object value = report[field]
                if (!(value instanceof Number)
                        || !Double.isFinite(((Number) value).doubleValue())
                        || ((Number) value).doubleValue() < 0.0D) {
                    throw new GradleException("Phase 8 scenario ${scenario} has invalid ${field}")
                }
            }
            if (report.p50Mspt > report.p95Mspt
                    || report.p95Mspt > report.p99Mspt
                    || report.p99Mspt > report.maxMspt) {
                throw new GradleException("Phase 8 scenario ${scenario} has unordered timing percentiles")
            }

            List<String> nonNegativeEvidenceFields = [
                    'nativeTaCZShootCount',
                    'acceptedServerGunShootEvents',
                    'nativeAmmoConsumed',
                    'liveTaCZBulletsAtEnd',
                    'garbageCollectionsDuringSample',
                    'ammoSharingAttemptsObserved',
                    'persistentDroppedAmmoEntities',
                    'sidearmLoadoutsObserved',
                    'sidearmActiveGuardsAtEnd',
                    'loadedArmoriesAtStart',
                    'loadedArmoriesAtEnd',
                    'armoryIndexQueries',
                    'armoryIndexVisitedRecords',
                    'armoryIndexReturnedArmories',
                    'armoryAssessments',
                    'armoryNeedAssessments',
                    'armoryControllerQueries',
                    'armoryCandidateRecords',
                    'armorySourceSlotInspections',
                    'armoryReservationAttempts',
                    'armoryPathConstructionAttempts',
                    'armoryMaximumPathAttemptsPerTrip',
                    'armorySuccessfulTransfers',
                    'armoryTransferredUnits',
                    'armoryNoSupplyOutcomes',
                    'armoryUnreachableOutcomes',
                    'armoryActiveGuardsAtEnd',
                    'armoryBackoffGuardsAtEnd',
                    'activeArmoryReservationsBeforeCleanup',
                    'activeArmoryReservationsAfterCleanup'
            ]
            nonNegativeEvidenceFields.each { field ->
                Object value = report[field]
                if (!(value instanceof Number) || ((Number) value).longValue() < 0L) {
                    throw new GradleException("Phase 8 scenario ${scenario} has invalid ${field}")
                }
            }
            if (report.acceptedServerGunShootEvents != report.nativeTaCZShootCount) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory native shot-event evidence")
            }
            if (!(report.usedHeapDeltaBytes instanceof Number)) {
                throw new GradleException("Phase 8 scenario ${scenario} has invalid usedHeapDeltaBytes")
            }
            if (!(report.armoryForcedChunkCountDelta instanceof Number)
                    || ((Number) report.armoryForcedChunkCountDelta).intValue() != 0) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} changed the forced-chunk set during its sample")
            }
            long armoryCandidateLimit = ((Number) report.armoryControllerQueries).longValue()
                    * 8L
            long armorySlotLimit = ((Number) report.armoryIndexReturnedArmories).longValue()
                    * 9L
            if (((Number) report.loadedArmoriesAtStart).intValue() != expectedArmories
                    || ((Number) report.loadedArmoriesAtEnd).intValue() != expectedArmories
                    || report.armoryIndexQueries != report.armoryControllerQueries
                    || report.armoryIndexVisitedRecords != report.armoryCandidateRecords
                    || ((Number) report.armoryIndexVisitedRecords).longValue()
                            > armoryCandidateLimit
                    || ((Number) report.armorySourceSlotInspections).longValue()
                            > armorySlotLimit
                    || ((Number) report.armoryReservationAttempts).longValue()
                            > ((Number) report.armorySourceSlotInspections).longValue()
                    || ((Number) report.armoryMaximumPathAttemptsPerTrip).intValue() > 8
                    || ((Number) report.armoryActiveGuardsAtEnd).intValue()
                            > ((Number) expectedScenario.guards).intValue()
                    || ((Number) report.armoryBackoffGuardsAtEnd).intValue()
                            > ((Number) expectedScenario.guards).intValue()) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory Armory bounds")
            }
            boolean armoryPerformance = expectedScenario.workload == 'armory_idle'
                    || expectedScenario.workload == 'armory_satisfied'
                    || expectedScenario.workload == 'armory_request_pressure'
            boolean passiveGuardWorkload = expectedScenario.workload == 'idle'
                    || expectedScenario.workload == 'idle_with_sidearms'
            if (passiveGuardWorkload
                    && (((Number) report.armoryIndexQueries).longValue() != 0L
                            || ((Number) report.armoryIndexVisitedRecords).longValue() != 0L
                            || ((Number) report.armorySourceSlotInspections).longValue() != 0L
                            || ((Number) report.armoryReservationAttempts).longValue() != 0L
                            || ((Number) report.armoryPathConstructionAttempts).longValue() != 0L)) {
                throw new GradleException(
                        "Passive guard scenario ${scenario} performed Armory search work")
            }
            if (armoryPerformance
                    && (((Number) report.activeArmoryReservationsAfterCleanup).intValue() != 0
                            || ((Number) report.armorySuccessfulTransfers).longValue() != 0L
                            || ((Number) report.armoryTransferredUnits).longValue() != 0L)) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} did not settle its Armory resources")
            }
            if (expectedScenario.workload == 'armory_idle'
                    && (((Number) report.armoryAssessments).longValue() != 0L
                            || ((Number) report.armoryIndexQueries).longValue() != 0L
                            || ((Number) report.armoryIndexVisitedRecords).longValue() != 0L
                            || ((Number) report.armorySourceSlotInspections).longValue() != 0L
                            || ((Number) report.armoryReservationAttempts).longValue() != 0L
                            || ((Number) report.armoryPathConstructionAttempts).longValue() != 0L)) {
                throw new GradleException(
                        "The idle-Armory scenario performed guard runtime work")
            }
            if (expectedScenario.workload == 'armory_satisfied'
                    && (((Number) report.armoryAssessments).longValue() <= 0L
                            || report.armoryNeedAssessments != report.armoryAssessments
                            || ((Number) report.armoryIndexQueries).longValue() != 0L
                            || ((Number) report.armoryIndexVisitedRecords).longValue() != 0L
                            || ((Number) report.armorySourceSlotInspections).longValue() != 0L
                            || ((Number) report.armoryReservationAttempts).longValue() != 0L
                            || ((Number) report.armoryPathConstructionAttempts).longValue() != 0L)) {
                throw new GradleException(
                        "The satisfied-guard Armory scenario did not preserve the no-query fast path")
            }
            if (expectedScenario.workload == 'armory_request_pressure'
                    && (((Number) report.armoryAssessments).longValue() <= 0L
                            || ((Number) report.armoryNeedAssessments).longValue() <= 0L
                            || ((Number) report.armoryIndexQueries).longValue() <= 0L
                            || ((Number) report.armoryIndexVisitedRecords).longValue() <= 0L
                            || ((Number) report.armoryIndexReturnedArmories).longValue() <= 0L
                            || ((Number) report.armorySourceSlotInspections).longValue() <= 0L
                            || ((Number) report.armoryReservationAttempts).longValue() <= 0L
                            || ((Number) report.armoryPathConstructionAttempts).longValue() <= 0L
                            || ((Number) report.armoryMaximumPathAttemptsPerTrip).intValue() <= 0
                            || ((Number) report.armoryNoSupplyOutcomes).longValue() <= 0L
                            || ((Number) report.armoryUnreachableOutcomes).longValue() <= 0L)) {
                throw new GradleException(
                        "The Armory request-pressure scenario lacks bounded search/path/backoff evidence")
            }
            if (((Number) report.ammoSharingAttemptsObserved).intValue()
                            < minimumAmmoSharingAttempts
                    || ((Number) report.persistentDroppedAmmoEntities).intValue()
                            < minimumPersistentDroppedAmmo) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} lacks ammunition workload evidence: "
                                + "sharing=${report.ammoSharingAttemptsObserved}/${minimumAmmoSharingAttempts}, "
                                + "drops=${report.persistentDroppedAmmoEntities}/${minimumPersistentDroppedAmmo}")
            }
            if (((Number) report.sidearmLoadoutsObserved).intValue()
                            != expectedSidearmLoadouts
                    || ((Number) report.sidearmActiveGuardsAtEnd).intValue()
                            < minimumSidearmActive
                    || ((Number) report.sidearmActiveGuardsAtEnd).intValue()
                            > maximumSidearmActive) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has invalid sidearm evidence: "
                                + "loadouts=${report.sidearmLoadoutsObserved}/${expectedSidearmLoadouts}, "
                                + "active=${report.sidearmActiveGuardsAtEnd}/"
                                + "${minimumSidearmActive}-${maximumSidearmActive}")
            }
            Set<String> validFinalSidearmStates = [
                    'PRIMARY_ACTIVE',
                    'SIDEARM_ACTIVE',
                    'RECOVERY_REQUIRED'
            ] as Set
            if (!(report.perGuardFinalState instanceof List)
                    || report.perGuardFinalState.size() != expectedScenario.guards
                    || report.perGuardFinalState.any {
                        !(it instanceof Map)
                                || !(it.guardIndex instanceof Number)
                                || !(it.sidearmState instanceof String)
                                || !validFinalSidearmStates.contains(it.sidearmState)
                                || !(it.activeGunId instanceof String)
                                || !(it.expectedGunId instanceof String)
                                || !(it.expectedSidearmActive instanceof Boolean)
                                || !(it.expectedTargetDistance instanceof Number)
                                || !(it.designatedTargetEntityId instanceof Number)
                                || !(it.currentTargetEntityId instanceof Number)
                                || !(it.currentTargetMatchesDesignated instanceof Boolean)
                                || !(it.designatedTargetDistance instanceof Number)
                                || !(it.observedDesignatedTargetDistance instanceof Number)
                                || !(it.designatedTargetDisplacement instanceof Number)
                                || !(it.guardAnchorDisplacement instanceof Number)
                                || !(it.currentTargetDistance instanceof Number)
                                || !(it.acceptedShotEvidence instanceof Number)
                                || !(it.firstSidearmActivationTick instanceof Number)
                    }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has invalid per-guard final-state evidence")
            }
            int finalActiveSidearms = report.perGuardFinalState.count {
                it.sidearmState == 'SIDEARM_ACTIVE'
            }
            int finalRecoveryRequired = report.perGuardFinalState.count {
                it.sidearmState == 'RECOVERY_REQUIRED'
            }
            if (finalActiveSidearms != ((Number) report.sidearmActiveGuardsAtEnd).intValue()
                    || finalRecoveryRequired != 0) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory final sidearm state: "
                                + "active=${finalActiveSidearms}/${report.sidearmActiveGuardsAtEnd}, "
                                + "recoveryRequired=${finalRecoveryRequired}")
            }

            if (!(report.perGuardFirstSidearmActivationTick instanceof List)
                    || report.perGuardFirstSidearmActivationTick.size()
                            != expectedScenario.guards
                    || report.perGuardFirstSidearmActivationTick.any {
                        !(it instanceof Number) || ((Number) it).intValue() < -1
                    }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has invalid observed activation timing")
            }
            List<Integer> observedActivationTicks =
                    report.perGuardFirstSidearmActivationTick.collect {
                        ((Number) it).intValue()
                    }
            List<Integer> nonNegativeActivationTicks = observedActivationTicks.findAll {
                it >= 0
            }
            int firstObservedActivationTick = nonNegativeActivationTicks.isEmpty()
                    ? -1
                    : nonNegativeActivationTicks.min() as int
            int lastObservedActivationTick = nonNegativeActivationTicks.isEmpty()
                    ? -1
                    : nonNegativeActivationTicks.max() as int
            if (report.firstObservedSidearmActivationTick != firstObservedActivationTick
                    || report.lastObservedSidearmActivationTick
                            != lastObservedActivationTick
                    || report.perGuardFinalState.withIndex().any { entry, index ->
                        ((Number) entry.guardIndex).intValue() != index
                                || ((Number) entry.firstSidearmActivationTick).intValue()
                                        != observedActivationTicks[index]
                    }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory per-guard evidence")
            }

            int expectedMinimumPerRole = scenario == 'mixed-explosive-standoff-sidearm-20'
                    ? 5
                    : 0
            int observedSidearmRoleFiring = 0
            int observedPrimaryRoleFiring = 0
            boolean finalRoleMappingValid = true
            boolean designatedTargetDistancesValid = true
            if (scenario == 'mixed-explosive-standoff-sidearm-20') {
                report.perGuardFinalState.eachWithIndex { entry, index ->
                    boolean expectedSidearm = index % 2 == 0
                    String expectedState = expectedSidearm
                            ? 'SIDEARM_ACTIVE'
                            : 'PRIMARY_ACTIVE'
                    String expectedGun = expectedSidearm
                            ? 'tacz:glock_17'
                            : 'tacz:rpg7'
                    double expectedDistance = expectedSidearm ? 4.0D : 20.0D
                    finalRoleMappingValid &= entry.expectedSidearmActive == expectedSidearm
                            && entry.sidearmState == expectedState
                            && entry.expectedGunId == expectedGun
                            && entry.activeGunId == expectedGun
                            && Double.compare(
                                    ((Number) entry.expectedTargetDistance).doubleValue(),
                                    expectedDistance) == 0
                    designatedTargetDistancesValid &= Math.abs(
                                    ((Number) entry.designatedTargetDistance).doubleValue()
                                    - expectedDistance) <= 0.5D
                    if (((Number) entry.acceptedShotEvidence).intValue() > 0) {
                        if (expectedSidearm) {
                            observedSidearmRoleFiring++
                        } else {
                            observedPrimaryRoleFiring++
                        }
                    }
                }
            }
            boolean activationTimingValid = true
            if (scenario == 'dry-primary-sidearm-switch-50') {
                report.perGuardFinalState.eachWithIndex { entry, index ->
                    int activationTick = observedActivationTicks[index]
                    activationTimingValid &= activationTick < 0
                            || (activationTick >= sidearmActivationTriggerTick
                                    && activationTick
                                            <= sidearmActivationTriggerTick + 200)
                    if (entry.sidearmState == 'SIDEARM_ACTIVE') {
                        activationTimingValid &= activationTick
                                >= sidearmActivationTriggerTick
                    }
                }
            }
            if (report.sidearmRoleFiringGuards != observedSidearmRoleFiring
                    || report.primaryRoleFiringGuards != observedPrimaryRoleFiring
                    || report.minimumFiringGuardsPerRole != expectedMinimumPerRole
                    || report.finalSidearmRoleMappingValid != finalRoleMappingValid
                    || report.designatedTargetDistancesValid
                            != designatedTargetDistancesValid
                    || report.sidearmActivationTimingValid != activationTimingValid
                    || !finalRoleMappingValid
                    || !designatedTargetDistancesValid
                    || !activationTimingValid
                    || observedSidearmRoleFiring < expectedMinimumPerRole
                    || observedPrimaryRoleFiring < expectedMinimumPerRole) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} failed role/timing evidence: "
                                + "sidearmRoleFiring=${observedSidearmRoleFiring}/${expectedMinimumPerRole}, "
                                + "primaryRoleFiring=${observedPrimaryRoleFiring}/${expectedMinimumPerRole}, "
                                + "mapping=${finalRoleMappingValid}, "
                                + "designatedTargets=${designatedTargetDistancesValid}, "
                                + "timing=${activationTimingValid}")
            }
            int currentTargetMismatchCount = report.perGuardFinalState.count {
                !it.currentTargetMatchesDesignated
            }
            if (!(report.currentTargetMismatchCount instanceof Number)
                    || ((Number) report.currentTargetMismatchCount).intValue()
                            != currentTargetMismatchCount) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory current-target diagnostics")
            }

            int acceptedShotEvidence = Math.max(
                    ((Number) report.nativeTaCZShootCount).intValue(),
                    ((Number) report.nativeAmmoConsumed).intValue())
            if (acceptedShotEvidence < minimumAcceptedShotEvidence) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has ${acceptedShotEvidence} native shots; "
                                + "at least ${minimumAcceptedShotEvidence} are required")
            }

            if (!(report.perGuardAcceptedShotEvidence instanceof List)
                    || report.perGuardAcceptedShotEvidence.size() != expectedScenario.guards
                    || report.perGuardAcceptedShotEvidence.any {
                        !(it instanceof Number) || ((Number) it).intValue() < 0
                    }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has invalid per-guard shot evidence")
            }
            if (report.perGuardFinalState.withIndex().any { entry, index ->
                ((Number) entry.acceptedShotEvidence).intValue()
                        != ((Number) report.perGuardAcceptedShotEvidence[index]).intValue()
            }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has contradictory per-guard shot evidence")
            }
            int activeFiringGuards = report.perGuardAcceptedShotEvidence.count {
                ((Number) it).intValue() > 0
            }
            List<Integer> allPerGuardEvidence = report.perGuardAcceptedShotEvidence.collect {
                ((Number) it).intValue()
            }
            int minimumPerGuardShotEvidence = allPerGuardEvidence.isEmpty()
                    ? 0
                    : allPerGuardEvidence.min() as int
            List<Integer> activePerGuardEvidence = allPerGuardEvidence.findAll { it > 0 }
            int minimumPerActiveGuardShotEvidence = activePerGuardEvidence.isEmpty()
                    ? 0
                    : activePerGuardEvidence.min() as int
            if (report.activeFiringGuards != activeFiringGuards
                    || report.minimumPerGuardShotEvidence != minimumPerGuardShotEvidence
                    || report.minimumPerActiveGuardShotEvidence
                            != minimumPerActiveGuardShotEvidence
                    || activeFiringGuards < minimumAcceptedFiringGuards
                    || minimumPerActiveGuardShotEvidence
                            < minimumAcceptedPerActiveGuardShotEvidence) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} did not exercise enough independent guards: "
                                + "active=${activeFiringGuards}/${minimumAcceptedFiringGuards}, "
                                + "minimumPerActiveGuard=${minimumPerActiveGuardShotEvidence}/"
                                + "${minimumAcceptedPerActiveGuardShotEvidence}")
            }
        }

        relativeTimingBudgets.each { scenario, budget ->
            Object report = parsedReports[scenario]
            String baselineScenario = budget.getOrDefault(
                    'baselineScenario',
                    'unarmed-idle-baseline-100') as String
            Object baseline = parsedReports[baselineScenario]
            double p95Limit = ((Number) baseline.p95Mspt).doubleValue()
                    * budget.p95Multiplier + budget.p95Allowance
            double p99Limit = ((Number) baseline.p99Mspt).doubleValue()
                    * budget.p99Multiplier + budget.p99Allowance
            if (((Number) report.p95Mspt).doubleValue() > p95Limit
                    || ((Number) report.p99Mspt).doubleValue() > p99Limit) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} exceeded its ${baselineScenario} budget: "
                                + "p95=${report.p95Mspt}/${p95Limit}, "
                                + "p99=${report.p99Mspt}/${p99Limit}")
            }
        }
    }
}

tasks.register('assembleReleaseCandidateEvidence') {
    group = 'build'
    description = 'Creates a deterministic manifest and checksum for the verified release JAR and performance evidence.'
    dependsOn tasks.named('verifyReleaseArtifact'), tasks.named('verifyPhase8PerformanceReports')
    outputs.dir releaseCandidateEvidenceDirectory
    outputs.upToDateWhen { false }

    doFirst {
        delete releaseCandidateEvidenceDirectory
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File performanceDirectory = phase8PerformanceReportDirectory.get().asFile
        File evidenceDirectory = releaseCandidateEvidenceDirectory.get().asFile
        evidenceDirectory.mkdirs()

        String sha256 = sha256OfFile(archive)
        List<File> performanceEvidenceFiles = performanceDirectory.listFiles()
                .findAll { file ->
                    file.isFile() && (file.name.endsWith('.json') || file.name.endsWith('.jfr'))
                }
                .sort { left, right -> left.name <=> right.name }
        int jsonReportCount = performanceDirectory.listFiles()
                .count { it.isFile() && it.name.endsWith('.json') }
        int jfrProfileCount = performanceDirectory.listFiles()
                .count { it.isFile() && it.name.endsWith('.jfr') }

        Map<String, Object> manifest = [
                schemaVersion  : 5,
                mod            : [
                        id     : mod_id,
                        name   : mod_name,
                        version: mod_version
                ],
                runtime        : [
                        minecraft    : minecraft_version,
                        forge        : forge_version,
                        guardVillagers: guard_villager_version,
                        tacz         : tacz_version,
                        fzzyConfig   : fzzy_config_version,
                        kotlinForForge: kotlin_for_forge_version
                ],
                artifact       : [
                        file  : archive.name,
                        bytes : archive.length(),
                        sha256: sha256
                ],
                verifiedEvidence: [
                        releaseArtifactGate   : 'passed',
                        performanceReportGate: 'passed',
                        performanceJsonReports: jsonReportCount,
                        performanceJfrProfiles: jfrProfileCount,
                        performanceHarnessSha256:
                                sha256OfFiles(performanceHarnessFiles)
                ],
                performanceEvidence: performanceEvidenceFiles.collect { file ->
                    [
                            file  : file.name,
                            bytes : file.length(),
                            sha256: sha256OfFile(file)
                        ]
                },
                naturalLoadoutAuthoring: naturalLoadoutAuthoringPaths.collect {
                    String relativePath ->
                        File file = layout.projectDirectory.file(relativePath).asFile
                        [
                                file  : relativePath,
                                bytes : file.length(),
                                sha256: sha256OfFile(file)
                        ]
                },
                separateEvidence: [
                        correctnessGameTests: './gradlew runGameTestServer',
                        manualCompatibility : 'docs/release-checklist.md',
                        ammunitionGuide     : 'docs/ammunition-quality-of-life.md',
                        naturalLoadoutGuide : 'docs/natural-guard-loadouts.md',
                        automatedAmmunitionGate:
                                './gradlew verifyAmmunitionReleaseCandidate'
                ]
        ]
        String json = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
        java.nio.file.Files.writeString(
                evidenceDirectory.toPath().resolve('release-candidate.json'),
                json,
                java.nio.charset.StandardCharsets.UTF_8)
        java.nio.file.Files.writeString(
                evidenceDirectory.toPath().resolve("${archive.name}.sha256"),
                "${sha256}  ${archive.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

tasks.register('verifyAmmunitionReleaseCandidate') {
    group = 'verification'
    description = 'Runs the complete automated release gate for ammunition and natural loadouts against fresh performance evidence.'

    if (phase8PerformanceEnabled.get()) {
        doFirst {
            throw new GradleException(
                    'Run verifyAmmunitionReleaseCandidate without -Pphase8Performance; '
                            + 'generate the performance matrix in its required separate invocation first.')
        }
    } else {
        dependsOn tasks.named('runGameTestServer'),
                tasks.named('assembleReleaseCandidateEvidence')
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File manifestFile = releaseCandidateEvidenceDirectory.get()
                .file('release-candidate.json').asFile
        File manualMatrix = layout.projectDirectory
                .file('docs/release-checklist.md').asFile
        File ammunitionGuide = layout.projectDirectory
                .file('docs/ammunition-quality-of-life.md').asFile
        File naturalLoadoutGuide = layout.projectDirectory
                .file('docs/natural-guard-loadouts.md').asFile
        List<File> naturalLoadoutAuthoringFiles = naturalLoadoutAuthoringPaths.collect {
            relativePath -> layout.projectDirectory.file(relativePath).asFile
        }
        if (!manifestFile.isFile() || !manualMatrix.isFile()
                || !ammunitionGuide.isFile() || !naturalLoadoutGuide.isFile()
                || naturalLoadoutAuthoringFiles.any { file -> !file.isFile() }) {
            throw new GradleException(
                    'Release evidence or a required manual validation document is missing')
        }

        Object manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (manifest.schemaVersion != 5
                || manifest.artifact.sha256 != sha256OfFile(archive)
                || manifest.verifiedEvidence.releaseArtifactGate != 'passed'
                || manifest.verifiedEvidence.performanceReportGate != 'passed'
                || manifest.verifiedEvidence.performanceJsonReports != 20
                || manifest.verifiedEvidence.performanceJfrProfiles != 20
                || manifest.verifiedEvidence.performanceHarnessSha256
                        != sha256OfFiles(performanceHarnessFiles)
                || manifest.separateEvidence.correctnessGameTests
                        != './gradlew runGameTestServer'
                || manifest.separateEvidence.manualCompatibility
                        != 'docs/release-checklist.md'
                || manifest.separateEvidence.ammunitionGuide
                        != 'docs/ammunition-quality-of-life.md'
                || manifest.separateEvidence.naturalLoadoutGuide
                        != 'docs/natural-guard-loadouts.md'
                || manifest.separateEvidence.automatedAmmunitionGate
                        != './gradlew verifyAmmunitionReleaseCandidate') {
            throw new GradleException(
                    'Release manifest does not bind the complete verified evidence set')
        }
        if (!(manifest.naturalLoadoutAuthoring instanceof List)
                || manifest.naturalLoadoutAuthoring.size()
                        != naturalLoadoutAuthoringPaths.size()) {
            throw new GradleException(
                    'Release manifest does not bind every natural-loadout authoring file')
        }
        naturalLoadoutAuthoringPaths.eachWithIndex { relativePath, index ->
            File file = layout.projectDirectory.file(relativePath).asFile
            Object evidence = manifest.naturalLoadoutAuthoring[index]
            if (evidence.file != relativePath
                    || evidence.bytes != file.length()
                    || evidence.sha256 != sha256OfFile(file)) {
                throw new GradleException(
                        "Natural-loadout authoring evidence is stale: ${relativePath}")
            }
        }

        String checklist = manualMatrix.getText('UTF-8')
        String guide = ammunitionGuide.getText('UTF-8')
        String naturalGuide = naturalLoadoutGuide.getText('UTF-8')
        List<String> requiredManualCases = [
                'AMMO-ENV-01',
                'AMMO-ENV-02',
                'AMMO-OWN-01',
                'AMMO-FEED-01',
                'AMMO-PICK-01',
                'AMMO-SHARE-01',
                'AMMO-LIFE-01',
                'AMMO-CFG-01'
        ]
        List<String> requiredSidearmCases = [
                'SIDEARM-VISUAL-01',
                'SIDEARM-RELOAD-01',
                'SIDEARM-SHIELD-01',
                'SIDEARM-LIFE-01',
                'SIDEARM-AMMO-01',
                'SIDEARM-AMMO-02',
                'SIDEARM-PACK-01',
                'SIDEARM-CONFIG-01',
                'SIDEARM-RECOVERY-01'
        ]
        List<String> requiredNaturalLoadoutCases = [
                'NATURAL-LIFE-01',
                'NATURAL-LIFE-02',
                'NATURAL-DROP-01',
                'NATURAL-DIFF-01',
                'NATURAL-POOL-01',
                'NATURAL-SOURCE-01',
                'NATURAL-AMMO-01',
                'NATURAL-EXPLOSIVE-01',
                'NATURAL-CAP-01',
                'NATURAL-SIDEARM-01'
        ]
        if (requiredManualCases.any { id -> !checklist.contains(id) }
                || requiredSidearmCases.any { id -> !checklist.contains(id) }
                || requiredNaturalLoadoutCases.any { id -> !checklist.contains(id) }
                || !guide.contains('Intentionally deferred')
                || !guide.contains('pickupDroppedAmmo')
                || !guide.contains('shareAmmoBetweenGuards')
                || !naturalGuide.contains('Step 8 balance and release guidance')
                || !naturalGuide.contains('Copy-ready examples and migration')
                || !naturalGuide.contains('naturalLoadouts.enabled = false')
                || !naturalGuide.contains('/vgg inspect <guard>')) {
            throw new GradleException(
                    'Release documentation lost a required manual case or rollback control')
        }
    }
}

tasks.register('verifyManualReleaseChecklist') {
    group = 'verification'
    description = 'Refuses a public release package until every recorded manual validation item has passed.'
    inputs.file(layout.projectDirectory.file('docs/release-checklist.md'))

    doLast {
        File checklistFile = layout.projectDirectory.file('docs/release-checklist.md').asFile
        List<String> lines = checklistFile.readLines('UTF-8')
        List<String> pendingRows = lines.findAll { line ->
            line.startsWith('|') && (line.contains('| Not run |') || line.contains('| Failed |'))
        }
        List<String> uncheckedItems = lines.findAll { line -> line.startsWith('- [ ]') }
        if (!pendingRows.isEmpty() || !uncheckedItems.isEmpty()) {
            throw new GradleException(
                    'Manual release validation is incomplete: '
                            + "${pendingRows.size()} table row(s) are Not run/Failed and "
                            + "${uncheckedItems.size()} checklist item(s) remain unchecked. "
                            + 'Complete docs/release-checklist.md against the exact release JAR first.')
        }
    }
}

tasks.register('prepareCurseForgeRelease', Sync) {
    group = 'distribution'
    description = 'Builds the verified CurseForge release handoff directory.'
    dependsOn tasks.named('verifyAmmunitionReleaseCandidate'),
            tasks.named('verifyVillageDefenseBuildingsReleaseCandidate'),
            tasks.named('verifyManualReleaseChecklist'),
            tasks.named('verifyVillageDefenseBuildingManualChecklist'),
            tasks.named('verifyPublicReleaseIdentity')

    into curseForgeReleaseDirectory
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from('docs/curseforge-description.md') {
        rename { 'DESCRIPTION.md' }
    }
    from("docs/releases/${mod_version}.md") {
        rename { "CHANGELOG-${mod_version}.md" }
    }
    from('docs/curseforge-upload.md') {
        rename { 'UPLOAD-CHECKLIST.md' }
    }
    from('LICENSE.txt')
    from('CREDITS.md')

    doLast {
        File archive = destinationDir.toPath()
                .resolve(tasks.named('jar', Jar).get().archiveFileName.get())
                .toFile()
        if (!archive.isFile()) {
            throw new GradleException("CurseForge handoff is missing its mod JAR: ${archive}")
        }
        java.nio.file.Files.writeString(
                destinationDir.toPath().resolve("${archive.name}.sha256"),
                "${sha256OfFile(archive)}  ${archive.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

