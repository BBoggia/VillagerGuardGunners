plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}-neoforge" }
// Isolate the port from the existing Forge release artifacts and test worlds.
layout.buildDirectory = layout.projectDirectory.dir('build/neoforge')
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def pinnedMods = new groovy.json.JsonSlurper().parse(file('gradle/neoforge-mods.json'))
def modCoordinates = { entry -> "maven.modrinth:${entry.projectId}:${entry.versionId}" }

sourceSets {
    coreqa
    multiplayerqa
    bootstrap
    gameTest { java.srcDir 'src/gametest/java'; resources.srcDir 'src/gametest/resources' }
    integrationGameTest { java.srcDir 'src/integrationtest/java'; resources.srcDir 'src/integrationtest/resources' }
    performanceGameTest { java.srcDir 'src/perftest/java'; resources.srcDir 'src/perftest/resources' }
}
configurations {
    installedMods { canBeConsumed = false; transitive = false }
    taczEmbeddedApi { canBeConsumed = false; transitive = false }
    bootstrapImplementation.extendsFrom implementation
    bootstrapCompileOnly.extendsFrom compileOnly
    bootstrapRuntimeOnly.extendsFrom runtimeOnly
}
[sourceSets.coreqa, sourceSets.multiplayerqa, sourceSets.gameTest, sourceSets.integrationGameTest, sourceSets.performanceGameTest].each { fixture ->
    configurations[fixture.implementationConfigurationName].extendsFrom(configurations.implementation)
    configurations[fixture.runtimeOnlyConfigurationName].extendsFrom(configurations.runtimeOnly)
    fixture.compileClasspath += sourceSets.main.output
    fixture.runtimeClasspath += sourceSets.main.output
}

neoForge {
    enable {
        version = neo_version
        // Obtain mapped binaries without duplicating the Minecraft decompile/recompile cache.
        disableRecompilation = true
    }
    [sourceSets.test, sourceSets.bootstrap, sourceSets.coreqa, sourceSets.multiplayerqa, sourceSets.gameTest, sourceSets.integrationGameTest,
     sourceSets.performanceGameTest].each { addModdingDependenciesTo it }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        vgg_port_bootstrap { sourceSet sourceSets.bootstrap }
    }
    runs {
        client {
            client()
            gameDirectory = file('build/neoforge/run/client')
            loadedMods = [mods[mod_id]]
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('build/neoforge/run/server')
            loadedMods = [mods[mod_id]]
        }
        bootstrapServer {
            server()
            sourceSet = sourceSets.bootstrap
            loadedMods = [mods.vgg_port_bootstrap]
            programArgument '--nogui'
            gameDirectory = file('build/neoforge/run/bootstrap')
        }
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    pinnedMods.each { entry ->
        installedMods(modCoordinates(entry)) { transitive = false }
        if (entry.name != 'kotlin') implementation(modCoordinates(entry)) { transitive = false }
    }
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"
    taczEmbeddedApi(modCoordinates(pinnedMods.find { it.name == 'tacz' }))
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

// Compile against the exact Lua classes shipped by TaCZ; do not embed a second runtime.
def luaDirectory = layout.buildDirectory.dir('tacz-embedded-api')
def extractTaCZLua = tasks.register('extractTaCZLua', Sync) {
    from({ zipTree(configurations.taczEmbeddedApi.singleFile) }) {
        include 'META-INF/jarjar/luaj-*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into luaDirectory
}
def luaApi = files(provider { fileTree(luaDirectory.get().asFile) { include '*.jar' } }).builtBy(extractTaCZLua)
dependencies { compileOnly luaApi; testRuntimeOnly luaApi }

def metadata = [
    minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
    neo_version: neo_version, neo_version_range: neo_version_range,
    loader_version_range: loader_version_range,
    guard_villager_version: guard_villager_version, guard_villager_version_range: guard_villager_version_range,
    tacz_version: tacz_version, tacz_version_range: tacz_version_range,
    fzzy_config_version: fzzy_config_version, fzzy_config_version_range: fzzy_config_version_range,
    kotlin_for_forge_version: kotlin_for_forge_version, kotlin_for_forge_version_range: kotlin_for_forge_version_range,
    mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
    mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description
]
tasks.withType(ProcessResources).configureEach {
    exclude '**/.DS_Store'
    inputs.properties metadata
    filesMatching(['META-INF/neoforge.mods.toml', 'bootstrap.properties', 'pack.mcmeta']) { expand metadata }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
    systemProperty 'villagerguardgunners.projectDir', projectDir.absolutePath
    systemProperty 'villagerguardgunners.artifact', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    inputs.files(fileTree('src'), fileTree('docs'), fileTree('gradle'), fileTree('.github/workflows'),
            fileTree('tools') { include '**/*.py' }, 'build.gradle', 'settings.gradle', 'gradle.properties')
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
}
tasks.register('combatTest', Test) {
    group = 'verification'
    description = 'Runs the migrated combat, inventory, role, orders, squad, and patrol checks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        ['*combat.*', '*inventory.*', '*ammunition.*', '*ai.*', '*orders.*', '*squad.*', '*sidearm.*', '*role.*',
         '*GuardAimingConfigTest', '*Squad*Test', '*Sidearm*Test', '*Orders*Test', '*GuardRolesContractTest',
         '*NativeCombatSourceContractTest', '*GuardPatrolRouteMovementControllerTest',
         '*RulesOfEngagementContractTest', '*GuardAllyProtectionContractTest'].each { includeTestsMatching it }
    }
}
tasks.register('supplyMedicalTest', Test) {
    group = 'verification'
    description = 'Runs migrated Armory, Quartermaster, and medical policy and persistence checks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        ['*armory.*', '*quartermaster.*', '*medical.*', '*ArmoryFoundationContractTest',
         '*ArmoryResupply*ContractTest', '*SupplyMedicalPackagingTest'].each { includeTestsMatching it }
    }
}
tasks.named('jar', Jar) {
    from('LICENSE.txt')
    manifest { attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version) }
}

def bootstrapJar = tasks.register('bootstrapJar', Jar) {
    group = 'verification'
    description = 'Builds the isolated dependency probe, not the gameplay mod.'
    from sourceSets.bootstrap.output
    archiveBaseName = 'vgg-port-bootstrap'
    destinationDirectory = layout.buildDirectory.dir('bootstrap')
}
def verifyPinnedMods = tasks.register('verifyPinnedMods') {
    group = 'verification'
    description = 'Checks the four installed mod JARs against their published SHA-512 hashes.'
    inputs.file 'gradle/neoforge-mods.json'
    inputs.files configurations.installedMods
    doLast {
        def artifacts = configurations.installedMods.resolvedConfiguration.resolvedArtifacts
        def propertiesByMod = [guard: guard_villager_version, tacz: tacz_version,
                               fzzy: fzzy_config_version, kotlin: kotlin_for_forge_version]
        def rangesByMod = [guard: guard_villager_version_range, tacz: tacz_version_range,
                           fzzy: fzzy_config_version_range, kotlin: kotlin_for_forge_version_range]
        pinnedMods.each { entry ->
            if (entry.version != propertiesByMod[entry.name]) throw new GradleException("Version pin disagrees with gradle.properties: ${entry.name}")
            if (rangesByMod[entry.name] != (entry.name == "fzzy" ? "[0.7.7+1.21+neoforge],[0.7.7+fix1+1.21+neoforge]" : "[${entry.version}]")) throw new GradleException("Loader range must match the full pinned mod version: ${entry.name}")
            def artifact = artifacts.find { it.moduleVersion.id.version == entry.versionId && it.name == entry.projectId }
            if (artifact == null) throw new GradleException("Missing pinned mod: ${entry.name}")
            def digest = java.security.MessageDigest.getInstance('SHA-512').digest(artifact.file.bytes).encodeHex().toString()
            if (digest != entry.sha512) throw new GradleException("Published checksum mismatch: ${entry.name}")
            logger.lifecycle("Verified ${entry.name} ${entry.version}")
        }
    }
}
tasks.register('stageBootstrapMods', Sync) {
    group = 'verification'
    description = 'Stages normal mod JARs and the isolated probe for installed-server testing.'
    dependsOn verifyPinnedMods
    from configurations.installedMods
    from bootstrapJar
    into layout.buildDirectory.dir('bootstrap/mods')
}
def verifyBootstrapArtifact = tasks.register('verifyBootstrapArtifact') {
    group = 'verification'
    description = 'Verifies probe isolation and Java 21 bytecode in the packaged test JAR.'
    dependsOn bootstrapJar
    inputs.file bootstrapJar.flatMap { it.archiveFile }
    doLast {
        new java.util.zip.ZipFile(bootstrapJar.get().archiveFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def probeClass = 'com/gamergaming/villagerguardgunners/bootstrap/NeoForgeBootstrap.class'
            if (names.findAll { it.endsWith('.class') } != [probeClass]
                    || names.any { it.startsWith('data/') || it.contains('mixin') }) {
                throw new GradleException('Dependency probe contains unexpected gameplay content')
            }
            byte[] bytecode = zip.getInputStream(zip.getEntry(probeClass)).withCloseable { it.bytes }
            if (bytecode[6] != 0 || bytecode[7] != 65) {
                throw new GradleException('Dependency probe must target Java 21')
            }
            def toml = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (toml.contains('${') || !toml.contains('modId="vgg_port_bootstrap"')) {
                throw new GradleException('Dependency probe metadata is not expanded or isolated')
            }
        }
    }
}
tasks.register('checkNeoForgeFoundation') {
    group = 'verification'
    description = 'Validates dependency pins, metadata expansion, and the separate bootstrap JAR.'
    dependsOn verifyPinnedMods, verifyBootstrapArtifact, tasks.named('processResources')
}
// The full check/build still compiles all production sources. Forge-era validation tasks
// are retained in gradle/legacy-forge.gradle for migration, and are not applied here.

// Installed-runtime tests remain a separate mod, never bundled in the gameplay JAR.
def coreQaJar = tasks.register('coreQaJar', Jar) {
    group = 'verification'
    from sourceSets.coreqa.output
    archiveBaseName = 'vgg-core-qa'
    destinationDirectory = layout.buildDirectory.dir('core-qa')
}
tasks.register('stageCoreQaMods', Sync) {
    group = 'verification'
    dependsOn verifyPinnedMods
    from configurations.installedMods
    from tasks.named('jar')
    from coreQaJar
    into layout.buildDirectory.dir('core-qa/mods')
}

apply from: 'gradle/neoforge-resources.gradle'

def multiplayerQaJar = tasks.register('multiplayerQaJar', Jar) {
    group = 'verification'
    from sourceSets.multiplayerqa.output
    archiveBaseName = 'vgg-multiplayer-qa'
    destinationDirectory = layout.buildDirectory.dir('multiplayer-qa')
}
tasks.register('stageMultiplayerQaMods', Sync) {
    group = 'verification'
    dependsOn verifyPinnedMods
    from configurations.installedMods
    from tasks.named('jar')
    from multiplayerQaJar
    into layout.buildDirectory.dir('multiplayer-qa/mods')
}

tasks.register('worldgenTest', Test) {
    group = 'verification'
    description = 'Runs village, discovery, population, and worldgen migration checks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        ['*worldgen.*', '*village.*', '*defense.*', '*spawn.*', '*WorldgenPackagingTest'].each { includeTestsMatching it }
    }
}

// The ordinary build must validate the entire port, not only selected test filters.
tasks.named('check') {
    dependsOn tasks.named('checkNeoForgeFoundation'), tasks.named('verifyNeoForgeCompanionPacks')
}

apply from: 'gradle/neoforge-distribution.gradle'

apply from: 'gradle/neoforge-shot-qa.gradle'
