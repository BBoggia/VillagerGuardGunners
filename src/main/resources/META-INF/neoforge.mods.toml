modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="mixins.${mod_id}.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="guardvillagers"
type="required"
versionRange="${guard_villager_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="${tacz_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fzzy_config"
type="required"
versionRange="${fzzy_config_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="${kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"

# Optional gun mods. Guards can use their guns when they are installed.
[[dependencies.${mod_id}]]
modId="cgm"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
