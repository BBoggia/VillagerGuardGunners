buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def phase8PerformanceEnabled = providers.gradleProperty('phase8Performance')
        .map { it.toBoolean() }
        .orElse(false)
def villageBuildingPerformanceEnabled = providers.gradleProperty(
        'villageBuildingPerformance')
        .map { it.toBoolean() }
        .orElse(false)
def step13PerformanceEnabled = providers.gradleProperty('step13Performance')
        .map { it.toBoolean() }
        .orElse(false)
def villageIntegrationProbesEnabled = providers.gradleProperty('villageIntegrationProbes')
        .map { it.toBoolean() }
        .orElse(false)
// These observation/acceptance fixtures use real goals and a dedicated process/world.
def guardIntelligenceTestMode = providers.gradleProperty('guardIntelligenceTestMode').orElse('off')
if (!(guardIntelligenceTestMode.get() in ['off', 'baseline', 'acceptance'])) {
    throw new GradleException('guardIntelligenceTestMode must be off, baseline, or acceptance')
}
def guardIntelligenceTestsEnabled = guardIntelligenceTestMode.get() != 'off'
def guardIntelligenceReportDirectory = providers.gradleProperty('guardIntelligenceReportDir')
        .orElse(layout.buildDirectory.dir('reports/guard-intelligence/' + guardIntelligenceTestMode.get())
                .get().asFile.absolutePath)
def anyPerformanceGameTestEnabled = providers.provider {
    phase8PerformanceEnabled.get()
            || villageBuildingPerformanceEnabled.get()
            || step13PerformanceEnabled.get()
}
def phase8PerformanceReportDirectory = layout.buildDirectory.dir('reports/phase8-performance')
def villageBuildingPerformanceReportDirectory = layout.buildDirectory.dir(
        'reports/village-building-performance')
def releaseCandidateEvidenceDirectory = layout.buildDirectory.dir('reports/release-candidate')
def villageBuildingEvidenceDirectory = layout.buildDirectory.dir(
        'reports/village-building-release-candidate')
def villageBuildingManualValidationDirectory = layout.buildDirectory.dir(
        "distributions/village-building-manual-validation/${mod_version}")
def curseForgeReleaseDirectory = layout.buildDirectory.dir(
        "distributions/curseforge/${mod_version}")
def generatedGameTestArenaDirectory = layout.buildDirectory.dir('generated/gametest-arena')
def generatedWatchtowerTemplateDirectory = layout.buildDirectory.dir(
        'generated/watchtower-template')
def watchtowerTemplateBlueprint = layout.projectDirectory.file(
        'src/main/templates/villagerguardgunners/watchtower.json')
def generatedVillageBuildingTemplateDirectory = layout.buildDirectory.dir(
        'generated/village-building-templates')
def villageBuildingTemplateBlueprint = layout.projectDirectory.file(
        'src/main/templates/villagerguardgunners/village_buildings.json')
def phase8ArtifactSha256Property = 'villagerguardgunners.phase8ProductionArtifactSha256'
def performanceHarnessSha256Property = 'villagerguardgunners.performanceHarnessSha256'
def naturalLoadoutAuthoringPaths = [
        'docs/guard-roles.md',
        'docs/natural-loadout-migration.md',
        'docs/natural-loadout-v3-sidearms.md',
        'docs/examples/natural-loadout-datapack/README.md',
        'docs/examples/natural-loadout-datapack/pack.mcmeta',
        'docs/examples/natural-loadout-datapack/data/vgg_example/guard_roles/village_marksman.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/contextual_guards.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/migrated_normal.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/role_marksmen.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/rifle_sidearms.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/tags/worldgen/biome/is_dry.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/tags/worldgen/structure/villages.json'
]
def sha256OfFile = { File file ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(file.bytes)
            .collect { String.format('%02x', it & 0xff) }
            .join()
}
def performanceHarnessFiles = files(
        fileTree('src/perftest') {
            include '**/*.java'
            include '**/*.*'
        },
        layout.projectDirectory.file('build.gradle'))
def sha256OfFiles = { FileCollection inputFiles ->
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    inputFiles.files.findAll { it.isFile() }
            .sort { left, right ->
                project.relativePath(left) <=> project.relativePath(right)
            }
            .each { file ->
                digest.update(project.relativePath(file).getBytes(
                        java.nio.charset.StandardCharsets.UTF_8))
                digest.update((byte) 0)
                digest.update(file.bytes)
                digest.update((byte) 0)
            }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

sourceSets {
    main {
        resources.srcDir generatedWatchtowerTemplateDirectory
        resources.srcDir generatedVillageBuildingTemplateDirectory
        resources.exclude('**/.DS_Store')
    }
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.setSrcDirs(['src/gametest/resources', generatedGameTestArenaDirectory])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    integrationGameTest {
        java.srcDir 'src/integrationtest/java'
        resources.setSrcDirs(['src/integrationtest/resources', generatedGameTestArenaDirectory])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    performanceGameTest {
        java.srcDir 'src/perftest/java'
        resources.srcDir 'src/perftest/resources'
        resources.srcDir generatedGameTestArenaDirectory
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('generateWatchtowerTemplate') {
    description = 'Compiles the reviewable watchtower layer blueprint into a Minecraft structure NBT.'
    File blueprint = watchtowerTemplateBlueprint.asFile
    File template = generatedWatchtowerTemplateDirectory.get().file(
            'data/villagerguardgunners/structures/watchtower.nbt').asFile
    inputs.file blueprint
    outputs.file template

    doLast {
        Map<String, Object> root = new groovy.json.JsonSlurper().parse(blueprint) as Map
        List<Integer> size = root.size as List<Integer>
        List<Map<String, Object>> palette = root.palette as List<Map<String, Object>>
        List<List<String>> layers = root.layers as List<List<String>>

        if (size.size() != 3 || size.any { it <= 0 }) {
            throw new GradleException('Watchtower size must contain three positive dimensions')
        }
        int width = size[0]
        int height = size[1]
        int depth = size[2]
        if (layers.size() != height
                || layers.any { it.size() != depth }
                || layers.flatten().any { it.length() != width }) {
            throw new GradleException(
                    "Watchtower layers must exactly match ${width}x${height}x${depth}")
        }

        Map<String, Integer> states = [:]
        Map<String, Map<String, Object>> paletteBySymbol = [:]
        palette.eachWithIndex { entry, index ->
            String symbol = entry.symbol as String
            if (symbol.length() != 1 || states.put(symbol, index) != null) {
                throw new GradleException(
                        "Watchtower palette symbol must be unique and one character: ${symbol}")
            }
            paletteBySymbol[symbol] = entry
            Map<String, Object> blockEntityData = (entry.nbt ?: [:]) as Map<String, Object>
            if (!blockEntityData.isEmpty()) {
                if (entry.name != 'minecraft:structure_block'
                        || blockEntityData.keySet() != (['mode', 'metadata'] as Set)
                        || blockEntityData.mode != 'DATA'
                        || !(blockEntityData.metadata instanceof String)
                        || (blockEntityData.metadata as String).length() > 128
                        || (!((blockEntityData.metadata as String).startsWith('guard_post:'))
                                && !((blockEntityData.metadata as String).startsWith('armory:')))) {
                    throw new GradleException(
                            "Watchtower marker ${symbol} has unsupported block-entity data")
                }
            }
        }
        Set<String> unknownSymbols = layers.flatten()
                .collectMany { it.toList() }
                .findAll { !states.containsKey(it) } as Set<String>
        if (!unknownSymbols.isEmpty()) {
            throw new GradleException(
                    "Watchtower layers use unknown symbols: ${unknownSymbols.sort()}")
        }
        int markerCount = layers.flatten()
                .collectMany { it.toList() }
                .count { symbol ->
                    !(((paletteBySymbol[symbol].nbt ?: [:]) as Map).isEmpty())
                }
        if (markerCount > 8) {
            throw new GradleException('Watchtower blueprint exceeds the eight-marker hard limit')
        }

        template.parentFile.mkdirs()
        template.withOutputStream { fileStream ->
            new java.util.zip.GZIPOutputStream(fileStream).withCloseable { gzipStream ->
                new DataOutputStream(gzipStream).withCloseable { output ->
                    Closure<Void> namedTag = { int type, String name, Closure<Void> payload ->
                        output.writeByte(type)
                        output.writeUTF(name)
                        payload.call()
                        null
                    }
                    Closure<Void> stringTag = { String name, String value ->
                        namedTag(8, name) { output.writeUTF(value) }
                        null
                    }
                    Closure<Void> intTag = { String name, int value ->
                        namedTag(3, name) { output.writeInt(value) }
                        null
                    }
                    Closure<Void> intListTag = { String name, List<Integer> values ->
                        namedTag(9, name) {
                            output.writeByte(3)
                            output.writeInt(values.size())
                            values.each { output.writeInt(it) }
                        }
                        null
                    }

                    output.writeByte(10)
                    output.writeUTF('')
                    intTag('DataVersion', root.dataVersion as int)
                    intListTag('size', size)

                    namedTag(9, 'palette') {
                        output.writeByte(10)
                        output.writeInt(palette.size())
                        palette.each { entry ->
                            stringTag('Name', entry.name as String)
                            Map<String, String> properties =
                                    (entry.properties ?: [:]) as Map<String, String>
                            if (!properties.isEmpty()) {
                                namedTag(10, 'Properties') {
                                    properties.keySet().sort().each { property ->
                                        stringTag(property, properties[property])
                                    }
                                    output.writeByte(0)
                                }
                            }
                            output.writeByte(0)
                        }
                    }

                    namedTag(9, 'blocks') {
                        output.writeByte(10)
                        output.writeInt(width * height * depth)
                        layers.eachWithIndex { layer, y ->
                            layer.eachWithIndex { row, z ->
                                row.toList().eachWithIndex { symbol, x ->
                                    intListTag('pos', [x, y, z])
                                    intTag('state', states[symbol])
                                    Map<String, Object> blockEntityData =
                                            (paletteBySymbol[symbol].nbt ?: [:]) as Map<String, Object>
                                    if (!blockEntityData.isEmpty()) {
                                        namedTag(10, 'nbt') {
                                            blockEntityData.keySet().sort().each { key ->
                                                stringTag(key, blockEntityData[key] as String)
                                            }
                                            output.writeByte(0)
                                        }
                                    }
                                    output.writeByte(0)
                                }
                            }
                        }
                    }

                    namedTag(9, 'entities') {
                        output.writeByte(10)
                        output.writeInt(0)
                    }
                    output.writeByte(0)
                }
            }
        }
    }
}

apply from: 'gradle/village-building-layouts.gradle'
apply from: 'gradle/village-building-templates.gradle'

tasks.register('generateVillageBuildingTemplates') {
    description = 'Compiles biome and layout-specific village templates and format-1 definitions.'
    inputs.file villageBuildingTemplateBlueprint
    inputs.files('gradle/village-building-layouts.gradle', 'gradle/village-building-templates.gradle')
    outputs.dir generatedVillageBuildingTemplateDirectory
    doLast {
        Map root = new groovy.json.JsonSlurper().parse(villageBuildingTemplateBlueprint.asFile) as Map
        File staged = new File(temporaryDir, 'resources')
        // Publish only after every template passes validation; remove stale variants on success.
        publishVillageBuildingResources(root, generatedVillageBuildingTemplateDirectory.get().asFile, staged)
    }
}

apply from: 'gradle/village-building-layout-tests.gradle'
apply from: 'gradle/barracks-designs.gradle'

tasks.register('generateIsolatedGameTestArena') {
    description = 'Generates the padded development-only structure used to isolate GameTest fixtures.'
    File arena = generatedGameTestArenaDirectory.get().file(
            'data/minecraft/structures/villagerguardgunners/gametest_arena.nbt').asFile
    File villageBuildingArena = generatedGameTestArenaDirectory.get().file(
            'data/villagerguardgunners_village_buildings_performance/structures/'
                    + 'villagerguardgunners/gametest_arena.nbt').asFile
    File integrationArena = generatedGameTestArenaDirectory.get().file(
            'data/villagerguardgunners_integration/structures/'
                    + 'villagerguardgunners/gametest_arena.nbt').asFile
    File combatArena = generatedGameTestArenaDirectory.get().file(
            'data/villagerguardgunners_combat_baseline/structures/'
                    + 'villagerguardgunners/gametest_arena.nbt').asFile
    outputs.files arena, villageBuildingArena, integrationArena, combatArena
    doLast {
        byte[] encodedArena = Base64.decoder.decode(
                '')
        arena.parentFile.mkdirs()
        arena.bytes = encodedArena
        villageBuildingArena.parentFile.mkdirs()
        villageBuildingArena.bytes = encodedArena
        integrationArena.parentFile.mkdirs()
        integrationArena.bytes = encodedArena
        combatArena.parentFile.mkdirs()
        combatArena.bytes = encodedArena
    }
}

tasks.named('processGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

tasks.named('processIntegrationGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

tasks.named('processPerformanceGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    integrationGameTestImplementation.extendsFrom implementation
    integrationGameTestRuntimeOnly.extendsFrom runtimeOnly
    performanceGameTestImplementation.extendsFrom implementation
    performanceGameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(
                    anyPerformanceGameTestEnabled.get() ? 'run-performance' : 'run')
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(
                    step13PerformanceEnabled.get()
                            ? 'run-step13-performance'
                            : phase8PerformanceEnabled.get()
                            ? 'run-phase8-performance'
                            : villageBuildingPerformanceEnabled.get()
                                    ? 'run-village-building-performance'
                                    : 'run-gametest')
            if (guardIntelligenceTestsEnabled) {
                if (anyPerformanceGameTestEnabled.get() || villageIntegrationProbesEnabled.get()) {
                    throw new GradleException('Guard intelligence fixtures must run separately from integration/performance modes.')
                }
                workingDirectory layout.buildDirectory.dir('guard-intelligence-runtime').get().asFile
                property 'forge.enabledGameTestNamespaces', "${mod_id}_combat_baseline"
                property 'villagerguardgunners.combatTestMode', guardIntelligenceTestMode.get()
                property 'villagerguardgunners.combatReportDir', file(guardIntelligenceReportDirectory.get()).absolutePath
            }
            if (step13PerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces',
                        "${mod_id}_village_buildings_performance,minecraft"
                property 'villagerguardgunners.phase8PerformanceReportDir',
                        phase8PerformanceReportDirectory.get().asFile.absolutePath
                property 'villagerguardgunners.villageBuildingPerformanceReportDir',
                        villageBuildingPerformanceReportDirectory.get().asFile.absolutePath
            } else if (phase8PerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces', "${mod_id}_performance,minecraft"
                property 'villagerguardgunners.phase8PerformanceReportDir',
                        phase8PerformanceReportDirectory.get().asFile.absolutePath
            } else if (villageBuildingPerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces',
                        "${mod_id}_village_buildings_performance"
                property 'villagerguardgunners.villageBuildingPerformanceReportDir',
                        villageBuildingPerformanceReportDirectory.get().asFile.absolutePath
            }
            if (villageIntegrationProbesEnabled.get()) {
                if (anyPerformanceGameTestEnabled.get()) {
                    throw new GradleException('Integration probes and performance runs must be separate.')
                }
                property 'forge.enabledGameTestNamespaces', "${mod_id}_integration"
                args '--mixin', 'mixins.villagerguardgunners.integration.json'
            }
            mods {
                "${mod_id}" {
                    source villageIntegrationProbesEnabled.get()
                            ? sourceSets.integrationGameTest
                            : anyPerformanceGameTestEnabled.get()
                            ? sourceSets.performanceGameTest
                            : sourceSets.gameTest
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('compileIntegrationGameTestJava'), tasks.named('processIntegrationGameTestResources')
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'FzzyMaven'
        url = 'https://maven.fzzyhmstrs.me/'
        content {
            includeGroup 'me.fzzyhmstrs'
        }
    }
}

// TaCZ embeds its Lua API. Compile against those exact classes without bundling another Lua runtime.
configurations { taczEmbeddedApi }
dependencies { taczEmbeddedApi("maven.modrinth:timeless-and-classics-zero:${tacz_version}") { transitive = false } }
def extractedTaCZLua = layout.buildDirectory.dir('tacz-embedded-api')
def extractTaCZLua = tasks.register('extractTaCZLua', Sync) {
    from({ zipTree(configurations.taczEmbeddedApi.singleFile) }) {
        include 'META-INF/jarjar/luaj-*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into extractedTaCZLua
}
def taczLuaApi = files(provider { fileTree(extractedTaCZLua.get().asFile) { include '*.jar' } }).builtBy(extractTaCZLua)

dependencies {
    compileOnly taczLuaApi
    testRuntimeOnly taczLuaApi
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:guard-villagers:${guard_villager_version}")
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    implementation fg.deobf("me.fzzyhmstrs:fzzy_config:${fzzy_config_version}+forge")
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
    // Forge loads these embedded Fzzy libraries in game; plain JUnit needs them explicitly.
    testRuntimeOnly 'blue.endless:jankson:1.2.3'
    testRuntimeOnly('net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7') {
        transitive = false // Use the Kotlin runtime supplied by Kotlin for Forge, as in game.
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'villagerguardgunners.projectDir', project.layout.projectDirectory.asFile.absolutePath
    // Several contracts intentionally inspect production/test sources and
    // release documentation as text. Declare those external reads so Gradle
    // cannot reuse a stale green test result after one of them changes.
    inputs.files(
            fileTree('src/main'),
            fileTree('src/gametest'),
            fileTree('src/perftest'),
            fileTree('docs'),
            files(
                    'build.gradle',
                    'gradle.properties',
                    'README.md',
                    'CHANGELOG.md',
                    '.github/workflows/ci.yml'))
}

tasks.named('check').configure {
    dependsOn tasks.named('compileGameTestJava'), tasks.named('compilePerformanceGameTestJava')
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateWatchtowerTemplate'),
            tasks.named('generateVillageBuildingTemplates')
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'           : "mixins.${mod_id}.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies that the reobfuscated release JAR contains only the supported add-on surface.'
    dependsOn tasks.named('test'),
            tasks.named('testVillageBuildingLayouts'),
            tasks.named('compileGameTestJava'),
            tasks.named('compilePerformanceGameTestJava'),
            tasks.named('reobfJar')

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR was not created: ${archive}")
        }

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(archive)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set
            List<String> requiredEntries = [
                    'com/gamergaming/villagerguardgunners/medical/GuardLifeRuntime.class',
                    'com/gamergaming/villagerguardgunners/medical/GuardLifeState.class',
                    'com/gamergaming/villagerguardgunners/mixin/GuardLifeMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/GuardDetourPathNavigationMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/GuardVillageReturnGoalMixin.class',
                    'com/gamergaming/villagerguardgunners/ai/navigation/GuardDetourPathPolicy.class',
                    'com/gamergaming/villagerguardgunners/mixin/CasualtyMobMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/CasualtyHealingMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/client/CasualtyRendererMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/client/CotNameTagMixin.class',
                    'com/gamergaming/villagerguardgunners/medical/CotRestRuntime.class',
                    'com/gamergaming/villagerguardgunners/medical/CotRestState.class',
                    'com/gamergaming/villagerguardgunners/medical/CasualtyCarePolicy.class',
                    'com/gamergaming/villagerguardgunners/medical/PlayerTreatmentRuntime.class',
                    'com/gamergaming/villagerguardgunners/client/CasualtyDisplay.class',
                    'data/villagerguardgunners/tags/damage_type/bypasses_downing.json',
                    'com/gamergaming/villagerguardgunners/quartermaster/service/QuartermasterProfession.class',
                    'com/gamergaming/villagerguardgunners/quartermaster/service/QuartermasterServiceRuntime.class',
                    'com/gamergaming/villagerguardgunners/quartermaster/service/ServiceTransactions.class',
                    'com/gamergaming/villagerguardgunners/quartermaster/service/ServiceJournal.class',
                    'data/villagerguardgunners/quartermaster_loadouts/rifleman.json',
