modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="mixins.${mod_id}.json"

# Applies only when Timeless and Classics Zero is installed.
[[mixins]]
config="mixins.${mod_id}.tacz.json"

# Applies only when a Point Blank build is installed.
[[mixins]]
config="mixins.${mod_id}.pointblank.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="guardvillagers"
type="required"
versionRange="${guard_villager_version_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="fzzy_config"
type="required"
versionRange="${fzzy_config_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="${kotlin_for_forge_version_range}"
ordering="NONE"
side="BOTH"

# Supported gun mods. Guards use the guns of whichever are installed; none is required.
[[dependencies.${mod_id}]]
modId="tacz"
type="optional"
versionRange="${tacz_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cgm"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="pointblank"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
