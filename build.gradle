                'safety.allies.additionalProtectedEntities'   : [],
                'safety.allies.excludedEntities'              : [],
                'ammunition.pickupDroppedAmmo'                : true,
                'ammunition.droppedAmmoPickupRadius'          : 1.5D,
                'ammunition.shareAmmoBetweenGuards'           : true,
                'ammunition.ammoSharingRadius'                : 8.0D,
                'ammunition.donorReserveMagazines'            : 1,
                'ammunition.requireMatchingOwnerForSharing'   : true,
                'performance.visibilitySampleIntervalTicks'    : 2,
                'performance.movementDecisionIntervalTicks'    : 5,
                'performance.pathRecalculationIntervalTicks'   : 20,
                'performance.gunDataRefreshIntervalTicks'      : 20,
                'performance.unsafeShotCacheTicks'             : 2,
                'performance.repositionProgressCheckTicks'     : 10
        ]
        Map<String, Map<String, Double>> relativeTimingBudgets = [
                'idle-armed-100'        : [p95Multiplier: 2.0D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.0D, p99Allowance: 3.0D],
                'semi-10'               : [p95Multiplier: 2.0D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.0D, p99Allowance: 3.0D],
                'semi-25'               : [p95Multiplier: 2.5D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.5D, p99Allowance: 3.0D],
                'semi-50'               : [p95Multiplier: 3.0D, p95Allowance: 3.0D,
                                           p99Multiplier: 4.0D, p99Allowance: 4.0D],
                'automatic-10'          : [p95Multiplier: 2.0D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.0D, p99Allowance: 3.0D],
                'automatic-25'          : [p95Multiplier: 2.5D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.5D, p99Allowance: 3.0D],
                'automatic-50'          : [p95Multiplier: 3.0D, p95Allowance: 3.0D,
                                           p99Multiplier: 4.0D, p99Allowance: 4.0D],
                'automatic-shotgun-10'  : [p95Multiplier: 2.5D, p95Allowance: 2.0D,
                                           p99Multiplier: 3.5D, p99Allowance: 3.0D],
                'explosive-10'          : [p95Multiplier: 3.0D, p95Allowance: 2.0D,
                                           p99Multiplier: 6.0D, p99Allowance: 4.0D],
                // Forge does not guarantee batch order. Navigation may be the
                // first profiled workload and must absorb one-time pathfinding
                // and JIT warmup without making the release gate flaky.
                'obstacle-navigation-25': [p95Multiplier: 6.0D, p95Allowance: 5.0D,
                                           p99Multiplier: 18.0D, p99Allowance: 10.0D],
                'protected-crossing-25' : [p95Multiplier: 2.5D, p95Allowance: 2.0D,
                                           p99Multiplier: 4.0D, p99Allowance: 3.0D],
                'dropped-ammo-pressure-100': [p95Multiplier: 3.0D, p95Allowance: 3.0D,
                                           p99Multiplier: 5.0D, p99Allowance: 5.0D],
                'dry-sharing-pressure-50': [p95Multiplier: 4.0D, p95Allowance: 4.0D,
                                           p99Multiplier: 7.0D, p99Allowance: 6.0D]
        ]
        if (!reportDirectory.isDirectory()) {
            throw new GradleException(
                    'Phase 8 performance reports are missing; run ./gradlew runGameTestServer -Pphase8Performance=true')
        }
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        String productionArtifactSha256 = sha256OfFile(archive)
        Map<String, Object> parsedReports = [:]

        Set<String> jsonScenarios = reportDirectory.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.json') }
                .collect { it.name.substring(0, it.name.length() - '.json'.length()) } as Set
        Set<String> jfrScenarios = reportDirectory.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.jfr') }
                .collect { it.name.substring(0, it.name.length() - '.jfr'.length()) } as Set
        if (jsonScenarios != requiredScenarios.keySet() || jfrScenarios != requiredScenarios.keySet()) {
            throw new GradleException(
                    "Phase 8 reports contain a missing or unexpected scenario; "
                            + "JSON=${jsonScenarios.sort()}, JFR=${jfrScenarios.sort()}")
        }

        requiredScenarios.each { scenario, expectedScenario ->
            File reportFile = new File(reportDirectory, "${scenario}.json")
            File profileFile = new File(reportDirectory, "${scenario}.jfr")
            if (!reportFile.isFile() || !profileFile.isFile() || profileFile.length() == 0L) {
                throw new GradleException("Phase 8 scenario ${scenario} is missing its JSON report or JFR profile")
            }

            long jfrEventCount = 0L
            long executionSampleCount = 0L
            jdk.jfr.consumer.RecordingFile recordingFile = null
            try {
                recordingFile = new jdk.jfr.consumer.RecordingFile(profileFile.toPath())
                while (recordingFile.hasMoreEvents()) {
                    def event = recordingFile.readEvent()
                    jfrEventCount++
                    if (event.eventType.name == 'jdk.ExecutionSample') {
                        executionSampleCount++
                    }
                }
            } catch (Exception exception) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has an unreadable JFR profile",
                        exception)
            } finally {
                recordingFile?.close()
            }
            if (jfrEventCount == 0L || executionSampleCount == 0L) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} JFR has no events or execution samples")
            }

            Object report = new groovy.json.JsonSlurper().parse(reportFile)
            parsedReports[scenario] = report
            int minimumAcceptedShotEvidence = (int) expectedScenario.minimumShotEvidence
            boolean firingWorkload = expectedScenario.workload == 'clear_lanes'
                    || expectedScenario.workload == 'protected_lanes'
            int minimumAcceptedFiringGuards = firingWorkload
                    ? Math.max(1, (((int) expectedScenario.guards) * 4 + 4).intdiv(5))
                    : 0
            int minimumAcceptedPerActiveGuardShotEvidence = firingWorkload ? 1 : 0
            int minimumAmmoSharingAttempts =
                    (int) expectedScenario.getOrDefault('minimumAmmoSharingAttempts', 0)
            int minimumPersistentDroppedAmmo =
                    (int) expectedScenario.getOrDefault('minimumPersistentDroppedAmmo', 0)
            if (report.scenario != scenario
                    || report.guards != expectedScenario.guards
                    || report.weapon != expectedScenario.weapon
                    || report.workload != expectedScenario.workload
                    || report.warmupTicks != 100
                    || report.sampleTicks != 1000
                    || report.configProfile != 'default-v7'
                    || report.configVersion != 7
                    || report.jfrProfile != "${scenario}.jfr"
                    || report.minimumAcceptedShotEvidence != minimumAcceptedShotEvidence
                    || report.minimumAcceptedFiringGuards != minimumAcceptedFiringGuards
                    || report.minimumAcceptedPerActiveGuardShotEvidence
                            != minimumAcceptedPerActiveGuardShotEvidence
                    || report.minimumAmmoSharingAttempts != minimumAmmoSharingAttempts
                    || report.minimumPersistentDroppedAmmo != minimumPersistentDroppedAmmo
                    || report.absoluteTimingGateApplied != false
                    || report.relativeTimingGateApplied != true
                    || report.productionArtifactSha256 != productionArtifactSha256) {
                throw new GradleException("Phase 8 scenario ${scenario} has invalid run metadata")
            }

            expectedConfig.each { path, expectedValue ->
                Object actualValue = path.tokenize('.').inject(report.guardGunnerConfig) {
                    Object current, String key -> current instanceof Map ? current[key] : null
                }
                boolean matches = expectedValue instanceof Number
                        ? actualValue instanceof Number
                            && Double.compare(
                                    ((Number) actualValue).doubleValue(),
                                    ((Number) expectedValue).doubleValue()) == 0
                        : actualValue == expectedValue
                if (!matches) {
                    throw new GradleException(
                            "Phase 8 scenario ${scenario} used ${path}=${actualValue}; "
                                    + "the default-v7 profile requires ${expectedValue}")
                }
            }

            List<String> timingFields = ['averageMspt', 'p50Mspt', 'p95Mspt', 'p99Mspt', 'maxMspt']
            timingFields.each { field ->
                Object value = report[field]
                if (!(value instanceof Number)
                        || !Double.isFinite(((Number) value).doubleValue())
                        || ((Number) value).doubleValue() < 0.0D) {
                    throw new GradleException("Phase 8 scenario ${scenario} has invalid ${field}")
                }
            }
            if (report.p50Mspt > report.p95Mspt
                    || report.p95Mspt > report.p99Mspt
                    || report.p99Mspt > report.maxMspt) {
                throw new GradleException("Phase 8 scenario ${scenario} has unordered timing percentiles")
            }

            List<String> nonNegativeEvidenceFields = [
                    'nativeTaCZShootCount',
                    'nativeAmmoConsumed',
                    'liveTaCZBulletsAtEnd',
                    'garbageCollectionsDuringSample',
                    'ammoSharingAttemptsObserved',
                    'persistentDroppedAmmoEntities'
            ]
            nonNegativeEvidenceFields.each { field ->
                Object value = report[field]
                if (!(value instanceof Number) || ((Number) value).longValue() < 0L) {
                    throw new GradleException("Phase 8 scenario ${scenario} has invalid ${field}")
                }
            }
            if (!(report.usedHeapDeltaBytes instanceof Number)) {
                throw new GradleException("Phase 8 scenario ${scenario} has invalid usedHeapDeltaBytes")
            }
            if (((Number) report.ammoSharingAttemptsObserved).intValue()
                            < minimumAmmoSharingAttempts
                    || ((Number) report.persistentDroppedAmmoEntities).intValue()
                            < minimumPersistentDroppedAmmo) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} lacks ammunition workload evidence: "
                                + "sharing=${report.ammoSharingAttemptsObserved}/${minimumAmmoSharingAttempts}, "
                                + "drops=${report.persistentDroppedAmmoEntities}/${minimumPersistentDroppedAmmo}")
            }

            int acceptedShotEvidence = Math.max(
                    ((Number) report.nativeTaCZShootCount).intValue(),
                    ((Number) report.nativeAmmoConsumed).intValue())
            if (acceptedShotEvidence < minimumAcceptedShotEvidence) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has ${acceptedShotEvidence} native shots; "
                                + "at least ${minimumAcceptedShotEvidence} are required")
            }

            if (!(report.perGuardAcceptedShotEvidence instanceof List)
                    || report.perGuardAcceptedShotEvidence.size() != expectedScenario.guards
                    || report.perGuardAcceptedShotEvidence.any {
                        !(it instanceof Number) || ((Number) it).intValue() < 0
                    }) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} has invalid per-guard shot evidence")
            }
            int activeFiringGuards = report.perGuardAcceptedShotEvidence.count {
                ((Number) it).intValue() > 0
            }
            int minimumPerGuardShotEvidence = report.perGuardAcceptedShotEvidence.collect {
                ((Number) it).intValue()
            }.min() as int
            List<Integer> activePerGuardEvidence = report.perGuardAcceptedShotEvidence.collect {
                ((Number) it).intValue()
            }.findAll { it > 0 }
            int minimumPerActiveGuardShotEvidence = activePerGuardEvidence.isEmpty()
                    ? 0
                    : activePerGuardEvidence.min() as int
            if (report.activeFiringGuards != activeFiringGuards
                    || report.minimumPerGuardShotEvidence != minimumPerGuardShotEvidence
                    || report.minimumPerActiveGuardShotEvidence
                            != minimumPerActiveGuardShotEvidence
                    || activeFiringGuards < minimumAcceptedFiringGuards
                    || minimumPerActiveGuardShotEvidence
                            < minimumAcceptedPerActiveGuardShotEvidence) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} did not exercise enough independent guards: "
                                + "active=${activeFiringGuards}/${minimumAcceptedFiringGuards}, "
                                + "minimumPerActiveGuard=${minimumPerActiveGuardShotEvidence}/"
                                + "${minimumAcceptedPerActiveGuardShotEvidence}")
            }
        }

        Object baseline = parsedReports['unarmed-idle-baseline-100']
        relativeTimingBudgets.each { scenario, budget ->
            Object report = parsedReports[scenario]
            double p95Limit = ((Number) baseline.p95Mspt).doubleValue()
                    * budget.p95Multiplier + budget.p95Allowance
            double p99Limit = ((Number) baseline.p99Mspt).doubleValue()
                    * budget.p99Multiplier + budget.p99Allowance
            if (((Number) report.p95Mspt).doubleValue() > p95Limit
                    || ((Number) report.p99Mspt).doubleValue() > p99Limit) {
                throw new GradleException(
                        "Phase 8 scenario ${scenario} exceeded its same-run baseline budget: "
                                + "p95=${report.p95Mspt}/${p95Limit}, "
                                + "p99=${report.p99Mspt}/${p99Limit}")
            }
        }
    }
}

tasks.register('assembleReleaseCandidateEvidence') {
    group = 'build'
    description = 'Creates a deterministic manifest and checksum for the verified release JAR and performance evidence.'
    dependsOn tasks.named('verifyReleaseArtifact'), tasks.named('verifyPhase8PerformanceReports')
    outputs.dir releaseCandidateEvidenceDirectory
    outputs.upToDateWhen { false }

    doFirst {
        delete releaseCandidateEvidenceDirectory
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File performanceDirectory = phase8PerformanceReportDirectory.get().asFile
        File evidenceDirectory = releaseCandidateEvidenceDirectory.get().asFile
        evidenceDirectory.mkdirs()

        String sha256 = sha256OfFile(archive)
        List<File> performanceEvidenceFiles = performanceDirectory.listFiles()
                .findAll { file ->
                    file.isFile() && (file.name.endsWith('.json') || file.name.endsWith('.jfr'))
                }
                .sort { left, right -> left.name <=> right.name }
        int jsonReportCount = performanceDirectory.listFiles()
                .count { it.isFile() && it.name.endsWith('.json') }
        int jfrProfileCount = performanceDirectory.listFiles()
                .count { it.isFile() && it.name.endsWith('.jfr') }

        Map<String, Object> manifest = [
                schemaVersion  : 3,
                mod            : [
                        id     : mod_id,
                        name   : mod_name,
                        version: mod_version
                ],
                runtime        : [
                        minecraft    : minecraft_version,
                        forge        : forge_version,
                        guardVillagers: guard_villager_version,
                        tacz         : tacz_version,
                        fzzyConfig   : fzzy_config_version,
                        kotlinForForge: kotlin_for_forge_version
                ],
                artifact       : [
                        file  : archive.name,
                        bytes : archive.length(),
                        sha256: sha256
                ],
                verifiedEvidence: [
                        releaseArtifactGate   : 'passed',
                        performanceReportGate: 'passed',
                        performanceJsonReports: jsonReportCount,
                        performanceJfrProfiles: jfrProfileCount
                ],
                performanceEvidence: performanceEvidenceFiles.collect { file ->
                    [
                            file  : file.name,
                            bytes : file.length(),
                            sha256: sha256OfFile(file)
                    ]
                },
                separateEvidence: [
                        correctnessGameTests: './gradlew runGameTestServer',
                        manualCompatibility : 'docs/release-checklist.md',
                        ammunitionGuide     : 'docs/ammunition-quality-of-life.md',
                        naturalLoadoutGuide : 'docs/natural-guard-loadouts.md',
                        automatedAmmunitionGate:
                                './gradlew verifyAmmunitionReleaseCandidate'
                ]
        ]
        String json = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
        java.nio.file.Files.writeString(
                evidenceDirectory.toPath().resolve('release-candidate.json'),
                json,
                java.nio.charset.StandardCharsets.UTF_8)
        java.nio.file.Files.writeString(
                evidenceDirectory.toPath().resolve("${archive.name}.sha256"),
                "${sha256}  ${archive.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

tasks.register('verifyAmmunitionReleaseCandidate') {
    group = 'verification'
    description = 'Runs the complete automated release gate for ammunition and natural loadouts against fresh performance evidence.'

    if (phase8PerformanceEnabled.get()) {
        doFirst {
            throw new GradleException(
                    'Run verifyAmmunitionReleaseCandidate without -Pphase8Performance; '
                            + 'generate the performance matrix in its required separate invocation first.')
        }
    } else {
        dependsOn tasks.named('runGameTestServer'),
                tasks.named('assembleReleaseCandidateEvidence')
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File manifestFile = releaseCandidateEvidenceDirectory.get()
                .file('release-candidate.json').asFile
        File manualMatrix = layout.projectDirectory
                .file('docs/release-checklist.md').asFile
        File ammunitionGuide = layout.projectDirectory
                .file('docs/ammunition-quality-of-life.md').asFile
        File naturalLoadoutGuide = layout.projectDirectory
                .file('docs/natural-guard-loadouts.md').asFile
        if (!manifestFile.isFile() || !manualMatrix.isFile()
                || !ammunitionGuide.isFile() || !naturalLoadoutGuide.isFile()) {
            throw new GradleException(
                    'Release evidence or a required manual validation document is missing')
        }

        Object manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (manifest.schemaVersion != 3
                || manifest.artifact.sha256 != sha256OfFile(archive)
                || manifest.verifiedEvidence.releaseArtifactGate != 'passed'
                || manifest.verifiedEvidence.performanceReportGate != 'passed'
                || manifest.verifiedEvidence.performanceJsonReports != 14
                || manifest.verifiedEvidence.performanceJfrProfiles != 14
                || manifest.separateEvidence.correctnessGameTests
                        != './gradlew runGameTestServer'
                || manifest.separateEvidence.manualCompatibility
                        != 'docs/release-checklist.md'
                || manifest.separateEvidence.ammunitionGuide
                        != 'docs/ammunition-quality-of-life.md'
                || manifest.separateEvidence.naturalLoadoutGuide
                        != 'docs/natural-guard-loadouts.md'
                || manifest.separateEvidence.automatedAmmunitionGate
                        != './gradlew verifyAmmunitionReleaseCandidate') {
            throw new GradleException(
                    'Release manifest does not bind the complete verified evidence set')
        }

        String checklist = manualMatrix.getText('UTF-8')
        String guide = ammunitionGuide.getText('UTF-8')
        String naturalGuide = naturalLoadoutGuide.getText('UTF-8')
        List<String> requiredManualCases = [
                'AMMO-ENV-01',
                'AMMO-ENV-02',
                'AMMO-OWN-01',
                'AMMO-FEED-01',
                'AMMO-PICK-01',
                'AMMO-SHARE-01',
                'AMMO-LIFE-01',
                'AMMO-CFG-01'
        ]
        List<String> requiredNaturalLoadoutCases = [
                'NATURAL-LIFE-01',
                'NATURAL-LIFE-02',
                'NATURAL-DROP-01',
                'NATURAL-DIFF-01',
                'NATURAL-POOL-01',
                'NATURAL-SOURCE-01',
                'NATURAL-AMMO-01',
                'NATURAL-EXPLOSIVE-01',
                'NATURAL-CAP-01'
        ]
        if (requiredManualCases.any { id -> !checklist.contains(id) }
                || requiredNaturalLoadoutCases.any { id -> !checklist.contains(id) }
                || !guide.contains('Intentionally deferred')
                || !guide.contains('pickupDroppedAmmo')
                || !guide.contains('shareAmmoBetweenGuards')
                || !naturalGuide.contains('Step 8 balance and release guidance')
                || !naturalGuide.contains('naturalLoadouts.enabled = false')
                || !naturalGuide.contains('/vgg inspect <guard>')) {
            throw new GradleException(
                    'Release documentation lost a required manual case or rollback control')
        }
    }
}

tasks.register('verifyManualReleaseChecklist') {
    group = 'verification'
    description = 'Refuses a public release package until every recorded manual validation item has passed.'
    inputs.file(layout.projectDirectory.file('docs/release-checklist.md'))

    doLast {
        File checklistFile = layout.projectDirectory.file('docs/release-checklist.md').asFile
        List<String> lines = checklistFile.readLines('UTF-8')
        List<String> pendingRows = lines.findAll { line ->
            line.startsWith('|') && (line.contains('| Not run |') || line.contains('| Failed |'))
        }
        List<String> uncheckedItems = lines.findAll { line -> line.startsWith('- [ ]') }
        if (!pendingRows.isEmpty() || !uncheckedItems.isEmpty()) {
            throw new GradleException(
                    'Manual release validation is incomplete: '
                            + "${pendingRows.size()} table row(s) are Not run/Failed and "
                            + "${uncheckedItems.size()} checklist item(s) remain unchecked. "
                            + 'Complete docs/release-checklist.md against the exact release JAR first.')
        }
    }
}

tasks.register('prepareCurseForgeRelease', Sync) {
    group = 'distribution'
    description = 'Builds the verified CurseForge 1.0 release handoff directory.'
    dependsOn tasks.named('verifyAmmunitionReleaseCandidate'),
            tasks.named('verifyManualReleaseChecklist')

    into curseForgeReleaseDirectory
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from('docs/curseforge-description.md') {
        rename { 'DESCRIPTION.md' }
    }
    from('docs/curseforge-release-notes-1.0.0.md') {
        rename { 'CHANGELOG-1.0.0.md' }
    }
    from('docs/curseforge-upload-1.0.0.md') {
        rename { 'UPLOAD-CHECKLIST.md' }
    }
    from('LICENSE.txt')
    from('CREDITS.md')

    doLast {
        File archive = destinationDir.toPath()
                .resolve(tasks.named('jar', Jar).get().archiveFileName.get())
                .toFile()
        if (!archive.isFile()) {
            throw new GradleException("CurseForge handoff is missing its mod JAR: ${archive}")
        }
        java.nio.file.Files.writeString(
                destinationDir.toPath().resolve("${archive.name}.sha256"),
                "${sha256OfFile(archive)}  ${archive.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8)
    }
}
