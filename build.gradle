buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def phase8PerformanceEnabled = providers.gradleProperty('phase8Performance')
        .map { it.toBoolean() }
        .orElse(false)
def phase8PerformanceReportDirectory = layout.buildDirectory.dir('reports/phase8-performance')
def releaseCandidateEvidenceDirectory = layout.buildDirectory.dir('reports/release-candidate')
def curseForgeReleaseDirectory = layout.buildDirectory.dir(
        "distributions/curseforge/${mod_version}")
def generatedGameTestArenaDirectory = layout.buildDirectory.dir('generated/gametest-arena')
def generatedWatchtowerTemplateDirectory = layout.buildDirectory.dir(
        'generated/watchtower-template')
def watchtowerTemplateBlueprint = layout.projectDirectory.file(
        'src/main/templates/villagerguardgunners/watchtower.json')
def phase8ArtifactSha256Property = 'villagerguardgunners.phase8ProductionArtifactSha256'
def naturalLoadoutAuthoringPaths = [
        'docs/guard-roles.md',
        'docs/natural-loadout-migration.md',
        'docs/natural-loadout-v3-sidearms.md',
        'docs/examples/natural-loadout-datapack/README.md',
        'docs/examples/natural-loadout-datapack/pack.mcmeta',
        'docs/examples/natural-loadout-datapack/data/vgg_example/guard_roles/village_marksman.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/contextual_guards.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/migrated_normal.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/role_marksmen.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/natural_guard_loadouts/rifle_sidearms.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/tags/worldgen/biome/is_dry.json',
        'docs/examples/natural-loadout-datapack/data/vgg_example/tags/worldgen/structure/villages.json'
]
def sha256OfFile = { File file ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(file.bytes)
            .collect { String.format('%02x', it & 0xff) }
            .join()
}

sourceSets {
    main {
        resources.srcDir generatedWatchtowerTemplateDirectory
    }
    gameTest {
        java.srcDir 'src/gametest/java'
        resources.setSrcDirs(['src/gametest/resources', generatedGameTestArenaDirectory])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    performanceGameTest {
        java.srcDir 'src/perftest/java'
        resources.srcDir 'src/perftest/resources'
        resources.srcDir generatedGameTestArenaDirectory
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('generateWatchtowerTemplate') {
    description = 'Compiles the reviewable watchtower layer blueprint into a Minecraft structure NBT.'
    File blueprint = watchtowerTemplateBlueprint.asFile
    File template = generatedWatchtowerTemplateDirectory.get().file(
            'data/villagerguardgunners/structures/watchtower.nbt').asFile
    inputs.file blueprint
    outputs.file template

    doLast {
        Map<String, Object> root = new groovy.json.JsonSlurper().parse(blueprint) as Map
        List<Integer> size = root.size as List<Integer>
        List<Map<String, Object>> palette = root.palette as List<Map<String, Object>>
        List<List<String>> layers = root.layers as List<List<String>>

        if (size.size() != 3 || size.any { it <= 0 }) {
            throw new GradleException('Watchtower size must contain three positive dimensions')
        }
        int width = size[0]
        int height = size[1]
        int depth = size[2]
        if (layers.size() != height
                || layers.any { it.size() != depth }
                || layers.flatten().any { it.length() != width }) {
            throw new GradleException(
                    "Watchtower layers must exactly match ${width}x${height}x${depth}")
        }

        Map<String, Integer> states = [:]
        Map<String, Map<String, Object>> paletteBySymbol = [:]
        palette.eachWithIndex { entry, index ->
            String symbol = entry.symbol as String
            if (symbol.length() != 1 || states.put(symbol, index) != null) {
                throw new GradleException(
                        "Watchtower palette symbol must be unique and one character: ${symbol}")
            }
            paletteBySymbol[symbol] = entry
            Map<String, Object> blockEntityData = (entry.nbt ?: [:]) as Map<String, Object>
            if (!blockEntityData.isEmpty()) {
                if (entry.name != 'minecraft:structure_block'
                        || blockEntityData.keySet() != (['mode', 'metadata'] as Set)
                        || blockEntityData.mode != 'DATA'
                        || !(blockEntityData.metadata instanceof String)
                        || (blockEntityData.metadata as String).length() > 128
                        || !(blockEntityData.metadata as String).startsWith('guard_post:')) {
                    throw new GradleException(
                            "Watchtower marker ${symbol} has unsupported block-entity data")
                }
            }
        }
        Set<String> unknownSymbols = layers.flatten()
                .collectMany { it.toList() }
                .findAll { !states.containsKey(it) } as Set<String>
        if (!unknownSymbols.isEmpty()) {
            throw new GradleException(
                    "Watchtower layers use unknown symbols: ${unknownSymbols.sort()}")
        }
        int markerCount = layers.flatten()
                .collectMany { it.toList() }
                .count { symbol ->
                    !(((paletteBySymbol[symbol].nbt ?: [:]) as Map).isEmpty())
                }
        if (markerCount > 8) {
            throw new GradleException('Watchtower blueprint exceeds the eight-marker hard limit')
        }

        template.parentFile.mkdirs()
        template.withOutputStream { fileStream ->
            new java.util.zip.GZIPOutputStream(fileStream).withCloseable { gzipStream ->
                new DataOutputStream(gzipStream).withCloseable { output ->
                    Closure<Void> namedTag = { int type, String name, Closure<Void> payload ->
                        output.writeByte(type)
                        output.writeUTF(name)
                        payload.call()
                        null
                    }
                    Closure<Void> stringTag = { String name, String value ->
                        namedTag(8, name) { output.writeUTF(value) }
                        null
                    }
                    Closure<Void> intTag = { String name, int value ->
                        namedTag(3, name) { output.writeInt(value) }
                        null
                    }
                    Closure<Void> intListTag = { String name, List<Integer> values ->
                        namedTag(9, name) {
                            output.writeByte(3)
                            output.writeInt(values.size())
                            values.each { output.writeInt(it) }
                        }
                        null
                    }

                    output.writeByte(10)
                    output.writeUTF('')
                    intTag('DataVersion', root.dataVersion as int)
                    intListTag('size', size)

                    namedTag(9, 'palette') {
                        output.writeByte(10)
                        output.writeInt(palette.size())
                        palette.each { entry ->
                            stringTag('Name', entry.name as String)
                            Map<String, String> properties =
                                    (entry.properties ?: [:]) as Map<String, String>
                            if (!properties.isEmpty()) {
                                namedTag(10, 'Properties') {
                                    properties.keySet().sort().each { property ->
                                        stringTag(property, properties[property])
                                    }
                                    output.writeByte(0)
                                }
                            }
                            output.writeByte(0)
                        }
                    }

                    namedTag(9, 'blocks') {
                        output.writeByte(10)
                        output.writeInt(width * height * depth)
                        layers.eachWithIndex { layer, y ->
                            layer.eachWithIndex { row, z ->
                                row.toList().eachWithIndex { symbol, x ->
                                    intListTag('pos', [x, y, z])
                                    intTag('state', states[symbol])
                                    Map<String, Object> blockEntityData =
                                            (paletteBySymbol[symbol].nbt ?: [:]) as Map<String, Object>
                                    if (!blockEntityData.isEmpty()) {
                                        namedTag(10, 'nbt') {
                                            blockEntityData.keySet().sort().each { key ->
                                                stringTag(key, blockEntityData[key] as String)
                                            }
                                            output.writeByte(0)
                                        }
                                    }
                                    output.writeByte(0)
                                }
                            }
                        }
                    }

                    namedTag(9, 'entities') {
                        output.writeByte(10)
                        output.writeInt(0)
                    }
                    output.writeByte(0)
                }
            }
        }
    }
}

tasks.register('generateIsolatedGameTestArena') {
    description = 'Generates the padded development-only structure used to isolate GameTest fixtures.'
    File arena = generatedGameTestArenaDirectory.get().file(
            'data/minecraft/structures/villagerguardgunners/gametest_arena.nbt').asFile
    outputs.file arena
    doLast {
        arena.parentFile.mkdirs()
        arena.bytes = Base64.decoder.decode(
                '')
    }
}

tasks.named('processGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

tasks.named('processPerformanceGameTestResources').configure {
    dependsOn tasks.named('generateIsolatedGameTestArena')
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    performanceGameTestImplementation.extendsFrom implementation
    performanceGameTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run')
            property 'forge.enabledGameTestNamespaces', "${mod_id},minecraft"
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(
                    phase8PerformanceEnabled.get() ? 'run-phase8-performance' : 'run-gametest')
            if (phase8PerformanceEnabled.get()) {
                property 'forge.enabledGameTestNamespaces', "${mod_id}_performance,minecraft"
                property 'villagerguardgunners.phase8PerformanceReportDir',
                        phase8PerformanceReportDirectory.get().asFile.absolutePath
            }
            mods {
                "${mod_id}" {
                    source phase8PerformanceEnabled.get()
                            ? sourceSets.performanceGameTest
                            : sourceSets.gameTest
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }
    maven {
        name = 'FzzyMaven'
        url = 'https://maven.fzzyhmstrs.me/'
        content {
            includeGroup 'me.fzzyhmstrs'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:guard-villagers:${guard_villager_version}")
    implementation fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    implementation fg.deobf("me.fzzyhmstrs:fzzy_config:${fzzy_config_version}+forge")
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'villagerguardgunners.projectDir', project.layout.projectDirectory.asFile.absolutePath
    // Several contracts intentionally inspect production/test sources and
    // release documentation as text. Declare those external reads so Gradle
    // cannot reuse a stale green test result after one of them changes.
    inputs.files(
            fileTree('src/main'),
            fileTree('src/gametest'),
            fileTree('src/perftest'),
            fileTree('docs'),
            files(
                    'build.gradle',
                    'gradle.properties',
                    'README.md',
                    'CHANGELOG.md',
                    '.github/workflows/ci.yml'))
}

tasks.named('check').configure {
    dependsOn tasks.named('compileGameTestJava'), tasks.named('compilePerformanceGameTestJava')
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateWatchtowerTemplate')
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'           : "mixins.${mod_id}.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies that the reobfuscated release JAR contains only the supported add-on surface.'
    dependsOn tasks.named('test'),
            tasks.named('compileGameTestJava'),
            tasks.named('compilePerformanceGameTestJava'),
            tasks.named('reobfJar')

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR was not created: ${archive}")
        }

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(archive)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set
            List<String> requiredEntries = [
