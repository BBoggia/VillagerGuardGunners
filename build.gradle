                    'com/gamergaming/villagerguardgunners/mixin/PopulationStructureStartMixin.class',
                    'com/gamergaming/villagerguardgunners/village/population/VillagePopulationRuntime.class',
                    'com/gamergaming/villagerguardgunners/village/population/VillagePopulationSavedData.class',
                    'com/gamergaming/villagerguardgunners/mixin/RaidMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/RaiseShieldGoalMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/TaCZCommonAssetsManagerMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/TaCZGuardShotMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/TaCZGuardProjectileMixin.class',
                    'com/gamergaming/villagerguardgunners/mixin/VillagerToGuardMixin.class'
            ]
            ['plains', 'desert', 'savanna', 'snowy', 'taiga'].each { biome ->
                ['barracks', 'armory', 'sentry_post', 'watchtower', 'training_yard'].each {
                        building ->
                    requiredEntries.add(
                            "data/villagerguardgunners/village_buildings/${building}/${biome}.json"
                                    .toString())
                    requiredEntries.add(
                            "data/villagerguardgunners/structures/village/${biome}/${building}.nbt"
                                    .toString())
                }
            }
            Map buildingBlueprint = new groovy.json.JsonSlurper().parse(villageBuildingTemplateBlueprint.asFile) as Map
            resolveVillageBuildingLayouts(buildingBlueprint).each { job ->
                requiredEntries.add("data/villagerguardgunners/village_buildings/${job.entryPath}.json".toString())
                requiredEntries.add("data/villagerguardgunners/structures/${job.templatePath}.nbt".toString())
            }
            List<String> missing = requiredEntries.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Release JAR is missing required entries: ${missing}")
            }

            List<String> prohibitedMarkers = [
                    '/gametest/',
                    'vggcompatprobe',
                    'accuracyprobe/',
                    'vggaccuracyprobe',
                    'villagerguardgunners_gametest',
                    'GuardBullet',
                    'GunMechanicsHandler',
                    'FireModeStrategy',
                    'GuardBehaviorTree',
                    'GuardReloadingGoal',
                    '.DS_Store'
            ]
            Set<String> prohibitedEntries = entries.findAll { entry ->
                prohibitedMarkers.any { marker -> entry.toLowerCase().contains(marker.toLowerCase()) }
            }
            if (!prohibitedEntries.isEmpty()) {
                throw new GradleException("Release JAR contains development or legacy entries: ${prohibitedEntries}")
            }

            Closure<String> readEntry = { String name ->
                new String(zip.getInputStream(zip.getEntry(name)).readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            }
            String manifest = readEntry('META-INF/MANIFEST.MF')
            if (!manifest.contains("Implementation-Version: ${project.version}")
                    || !manifest.contains('MixinConfigs: mixins.villagerguardgunners.json')
                    || manifest.contains('Implementation-Timestamp')) {
                throw new GradleException('Release manifest version, mixin, or reproducibility contract failed')
            }

            String metadata = readEntry('META-INF/mods.toml')
            Map<String, String> dependencyVersions = [
                    forge          : forge_version_range,
                    minecraft      : minecraft_version_range,
                    guardvillagers : "[1.20.1-${guard_villager_version}]",
                    tacz           : "[${tacz_version}]",
                    fzzy_config    : fzzy_config_version_range,
                    kotlinforforge : kotlin_for_forge_version_range
            ]
            dependencyVersions.each { dependencyId, versionRange ->
                if (!metadata.contains("modId=\"${dependencyId}\"")
                        || !metadata.contains("versionRange=\"${versionRange}\"")) {
                    throw new GradleException("Release metadata lost the exact ${dependencyId} dependency range")
                }
            }
            if (metadata.count('[[dependencies.villagerguardgunners]]') != dependencyVersions.size()) {
                throw new GradleException('Release metadata contains an unexpected dependency surface')
            }

            String refmap = readEntry('villagerguardgunners.refmap.json')
            if (refmap.trim().isEmpty()
                    || !refmap.contains('mixin/GuardMixin')
                    || !refmap.contains('mixin/GuardLifeMixin')
                    || !refmap.contains('mixin/CasualtyMobMixin')
                    || !refmap.contains('mixin/CasualtyHealingMixin')
                    || !refmap.contains('mixin/client/CasualtyRendererMixin')
                    || !refmap.contains('mixin/client/CotNameTagMixin')
                    || !refmap.contains('mixin/ItemEntityMixin')
                    || !refmap.contains('mixin/BellBlockMixin')
                    || !refmap.contains('mixin/RaidMixin')
                    || !refmap.contains('mixin/accessor/LootTableAccessor')
                    || !refmap.contains('mixin/accessor/RaidsAccessor')
                    || !refmap.contains('mixin/accessor/StructureTemplatePoolAccessor')
                    || !refmap.contains('mixin/accessor/VillagePoiStorageAccessor')
                    || !refmap.contains('mixin/accessor/VillagePoolElementAccessor')
                    || !refmap.contains('mixin/TacticalPathNavigationMixin')
                    || !refmap.contains('mixin/GuardDetourPathNavigationMixin')
                    || !refmap.contains('mixin/GuardVillageReturnGoalMixin')
                    || !refmap.contains('mixin/RaiseShieldGoalMixin')
                    || !refmap.contains('mixin/VillagerToGuardMixin')) {
                throw new GradleException('Release mixin refmap is empty or missing common-server mappings')
            }
            def villageReturnMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/GuardVillageReturnGoalMixin']
            String strollOwner = 'Lnet/minecraft/world/entity/ai/goal/RandomStrollGoal;'
            if (villageReturnMappings?.canUse != strollOwner + 'm_8036_()Z'
                    || villageReturnMappings?.canContinueToUse != strollOwner + 'm_8045_()Z') {
                throw new GradleException('Guard village-return hooks are not remapped for production Minecraft 1.20.1')
            }
            def detourMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/GuardDetourPathNavigationMixin']
            if (detourMappings?.get('createPath(Ljava/util/Set;IZI)Lnet/minecraft/world/level/pathfinder/Path;') !=
                    'Lnet/minecraft/world/entity/ai/navigation/PathNavigation;m_26551_(Ljava/util/Set;IZI)Lnet/minecraft/world/level/pathfinder/Path;') {
                throw new GradleException('Guard detour navigation is not remapped for production Minecraft 1.20.1')
            }
            def cotMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/client/CotNameTagMixin']
            def selectionMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/VillageBuildingSelectionMixin']
            if (selectionMappings?.getShuffledTemplates !=
                    'Lnet/minecraft/world/level/levelgen/structure/pools/StructureTemplatePool;m_227362_(Lnet/minecraft/util/RandomSource;)Ljava/util/List;') {
                throw new GradleException('Building selection is not remapped for production village generation')
            }
            def terrainMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/VillageBuildingTerrainMixin']
            if (terrainMappings?.tryPlacingChildren !=
                    'Lnet/minecraft/world/level/levelgen/structure/pools/JigsawPlacement$Placer;m_227264_(Lnet/minecraft/world/level/levelgen/structure/PoolElementStructurePiece;Lorg/apache/commons/lang3/mutable/MutableObject;IZLnet/minecraft/world/level/LevelHeightAccessor;Lnet/minecraft/world/level/levelgen/RandomState;)V'
                    || !terrainMappings.values().any { it.contains('Shapes;m_83157_(') }
                    || !terrainMappings.values().any { it.contains('StructurePoolElement;m_214015_(') }) {
                throw new GradleException('Building terrain screening is not remapped for production village generation')
            }
            if (cotMappings['Lnet/minecraft/world/entity/Entity;getNameTagOffsetY()F']
                    != 'Lnet/minecraft/world/entity/Entity;m_278726_()F') {
                throw new GradleException('Cot name-tag invocation is not remapped for the production Minecraft 1.20.1 client')
            }
            def checkpointMappings = new groovy.json.JsonSlurper().parseText(refmap).mappings[
                    'com/gamergaming/villagerguardgunners/mixin/WalkBackToCheckPointGoalMixin']
            String checkpointOwner = 'Ltallestegg/guardvillagers/entities/ai/goals/WalkBackToCheckPointGoal;'
            if (checkpointMappings?.canUse != checkpointOwner + 'm_8036_()Z'
                    || checkpointMappings?.canContinueToUse != checkpointOwner + 'm_8045_()Z') {
                throw new GradleException('Checkpoint goal hooks are not remapped for the production Guard Villagers JAR')
            }

            Object mixinMetadata = new groovy.json.JsonSlurper().parseText(
                    readEntry('mixins.villagerguardgunners.json'))
            if (mixinMetadata.mixins != [
                        'GuardLifeMixin',
                        'CasualtyMobMixin',
                        'CasualtyHealingMixin',
                        'BellBlockMixin',
                        'GuardMixin',
                        'TacticalPathNavigationMixin',
                        'GuardDetourPathNavigationMixin',
                        'GuardVillageReturnGoalMixin',
                        'ItemEntityMixin',
                    'PopulationStructureStartMixin',
                        'VillageBuildingSelectionMixin',
                        'VillageBuildingTerrainMixin',
                        'RaidMixin',
                        'RaiseShieldGoalMixin',
                        'TaCZCommonAssetsManagerMixin',
                        'TaCZGuardShotMixin',
                        'TaCZGuardProjectileMixin',
                        'VillagerToGuardMixin',
                        'WalkBackToCheckPointGoalMixin',
                        'accessor.LootPoolAccessor',
                        'accessor.LootPoolEntryAccessor',
                        'accessor.LootPoolSingletonAccessor',
                        'accessor.LootTableAccessor',
                        'accessor.RaidsAccessor',
                        'accessor.StructureTemplatePoolAccessor',
                        'accessor.VillagePoiStorageAccessor',
                        'accessor.VillagePoolElementAccessor',
                        'IntegratedVillageTagLoaderMixin'
                    ]
                    || mixinMetadata.client != [
                        'client.GuardModelMixin',
                        'client.GuardSteveModelMixin',
                        'client.CasualtyRendererMixin',
                        'client.CotNameTagMixin'
                    ]) {
                throw new GradleException(
                        'Release mixin metadata no longer isolates client-only model mixins')
            }

            String productionPackage = 'com/gamergaming/villagerguardgunners/'
            List<String> clientOnlyPrefixes = [
                    "${productionPackage}client/",
                    "${productionPackage}mixin/client/"
            ]
            Set<String> commonClassesWithClientReferences = entries.findAll { entry ->
                entry.startsWith(productionPackage)
                        && entry.endsWith('.class')
                        && !clientOnlyPrefixes.any { prefix -> entry.startsWith(prefix) }
                        && new String(
                                zip.getInputStream(zip.getEntry(entry)).readAllBytes(),
                                java.nio.charset.StandardCharsets.ISO_8859_1)
                                .contains('net/minecraft/client/')
            }
            if (!commonClassesWithClientReferences.isEmpty()) {
                throw new GradleException(
                        "Common-server classes contain client-only references: ${commonClassesWithClientReferences}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseArtifact')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    if (anyPerformanceGameTestEnabled.get()) {
        dependsOn tasks.named('reobfJar')
    }
    doFirst {
        if (guardIntelligenceTestsEnabled) {
            // Only this disposable, build-owned runtime is reset; ordinary test/player worlds are untouched.
            delete layout.buildDirectory.dir('guard-intelligence-runtime')
            layout.buildDirectory.dir('guard-intelligence-runtime').get().asFile.mkdirs()
            file(guardIntelligenceReportDirectory.get()).mkdirs()
        }
        int selectedPerformanceModes = [
                phase8PerformanceEnabled.get(),
                villageBuildingPerformanceEnabled.get(),
                step13PerformanceEnabled.get()
        ].count { it }
        if (selectedPerformanceModes > 1) {
            throw new GradleException(
                    'Choose one performance mode; Step 13 already includes both component suites.')
        }
        if (anyPerformanceGameTestEnabled.get()) {
            File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
            if (!archive.isFile()) {
                throw new GradleException("Performance run production artifact is missing: ${archive}")
            }
            systemProperty phase8ArtifactSha256Property, sha256OfFile(archive)
            systemProperty performanceHarnessSha256Property,
                    sha256OfFiles(performanceHarnessFiles)
        }
        if (step13PerformanceEnabled.get()) {
            File harnessClass = layout.buildDirectory.file(
                    'classes/java/performanceGameTest/com/gamergaming/'
                            + 'villagerguardgunners/worldgen/village/'
                            + 'VillageDefenseBuildingsPerformanceGameTests.class')
                    .get().asFile
            if (!harnessClass.isFile()) {
                throw new GradleException(
                        'Village-building performance harness was not compiled; '
                                + 'rerun compilePerformanceGameTestJava with --rerun-tasks.')
            }
            delete phase8PerformanceReportDirectory
            delete villageBuildingPerformanceReportDirectory
            delete layout.projectDirectory.dir('run-step13-performance/world')
            delete layout.projectDirectory.file(
                    'run-step13-performance/config/villagerguardgunners/guard_gunners.toml')
            phase8PerformanceReportDirectory.get().asFile.mkdirs()
            villageBuildingPerformanceReportDirectory.get().asFile.mkdirs()
        } else if (phase8PerformanceEnabled.get()) {
            delete phase8PerformanceReportDirectory
            delete layout.projectDirectory.dir('run-phase8-performance/world')
            delete layout.projectDirectory.file(
                    'run-phase8-performance/config/villagerguardgunners/guard_gunners.toml')
            phase8PerformanceReportDirectory.get().asFile.mkdirs()
        } else if (villageBuildingPerformanceEnabled.get()) {
            File harnessClass = layout.buildDirectory.file(
                    'classes/java/performanceGameTest/com/gamergaming/'
                            + 'villagerguardgunners/worldgen/village/'
                            + 'VillageDefenseBuildingsPerformanceGameTests.class')
                    .get().asFile
            if (!harnessClass.isFile()) {
                throw new GradleException(
                        'Village-building performance harness was not compiled; '
                                + 'rerun compilePerformanceGameTestJava with --rerun-tasks.')
            }
            delete villageBuildingPerformanceReportDirectory
            delete layout.projectDirectory.dir('run-village-building-performance/world')
            delete layout.projectDirectory.file(
                    'run-village-building-performance/config/villagerguardgunners/guard_gunners.toml')
            villageBuildingPerformanceReportDirectory.get().asFile.mkdirs()
        } else {
            delete layout.projectDirectory.dir('run-gametest/world')
            delete layout.projectDirectory.file(
                    'run-gametest/config/villagerguardgunners/guard_gunners.toml')
        }
    }
    doLast {
        if (villageBuildingPerformanceEnabled.get() || step13PerformanceEnabled.get()) {
            File reportDirectory = villageBuildingPerformanceReportDirectory.get().asFile
            File report = new File(reportDirectory, 'village-buildings-100.json')
            File profile = new File(reportDirectory, 'village-buildings-100.jfr')
            if (!report.isFile() || !profile.isFile() || profile.length() == 0L) {
                throw new GradleException(
                        'Village-building performance GameTest produced no JSON/JFR evidence; '
                                + 'a zero-test server run is not accepted.')
            }
        }
        if (step13PerformanceEnabled.get()) {
            File reportDirectory = phase8PerformanceReportDirectory.get().asFile
            int jsonReports = reportDirectory.listFiles()
                    .count { it.isFile() && it.name.endsWith('.json') }
            int jfrProfiles = reportDirectory.listFiles()
                    .count { it.isFile() && it.name.endsWith('.jfr') }
            if (jsonReports != 20 || jfrProfiles != 20) {
                throw new GradleException(
                        'The combined Step 13 performance run did not produce all 20 '
                                + 'combat/logistics JSON and JFR pairs.')
            }
        }
    }
}

tasks.register('verifyVillageBuildingPerformanceReport') {
    group = 'verification'
    description = 'Validates the opt-in village-building startup and 100-placement JFR evidence.'
    dependsOn tasks.named('verifyReleaseArtifact')
    inputs.files(performanceHarnessFiles)

    doLast {
        File reportDirectory = villageBuildingPerformanceReportDirectory.get().asFile
        File reportFile = new File(reportDirectory, 'village-buildings-100.json')
        File profileFile = new File(reportDirectory, 'village-buildings-100.jfr')
        if (!reportFile.isFile() || !profileFile.isFile() || profileFile.length() == 0L) {
            throw new GradleException(
                    'Village-building performance evidence is missing; run ./gradlew runGameTestServer -PvillageBuildingPerformance=true')
        }
        if (reportDirectory.listFiles().findAll { it.isFile() }.collect { it.name } as Set
                != (['village-buildings-100.json', 'village-buildings-100.jfr'] as Set)) {
            throw new GradleException(
                    'Village-building performance evidence contains missing or unexpected files')
        }

        long jfrEventCount = 0L
        long executionSampleCount = 0L
        jdk.jfr.consumer.RecordingFile recordingFile = null
        try {
            recordingFile = new jdk.jfr.consumer.RecordingFile(profileFile.toPath())
            while (recordingFile.hasMoreEvents()) {
                def event = recordingFile.readEvent()
                jfrEventCount++
                if (event.eventType.name == 'jdk.ExecutionSample') {
                    executionSampleCount++
                }
            }
        } catch (IOException | RuntimeException exception) {
            throw new GradleException(
                    'The village-building JFR profile is unreadable', exception)
        } finally {
            recordingFile?.close()
        }
        if (jfrEventCount == 0L || executionSampleCount == 0L) {
            throw new GradleException(
                    'The village-building JFR profile has no events or execution samples')
        }

        Object report = new groovy.json.JsonSlurper().parse(reportFile)
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        List<String> timingFields = [
                'noSelectionTotalMillis',
                'startupIntegrationMillis',
                'placementTotalMillis',
                'placementP50Millis',
                'placementP95Millis',
                'placementP99Millis',
                'placementMaxMillis',
                'idleP50Mspt',
                'idleP95Mspt',
                'idleP99Mspt',
                'idleMaxMspt'
        ]
        if (report.schemaVersion != 3
                || report.scenario != 'village-buildings-100'
                || report.candidateVillages != 100
                || report.noSelectionCandidates != 100
                || report.noSelectionVggSelections != 0
                || report.selectedBuildingCandidates != 100
                || report.simultaneousInitializationCandidates != 100
                || report.passiveTemplates != 5
                || report.targetPools != 5
                || !(report.preexistingPoolEntries instanceof Number)
                || ((Number) report.preexistingPoolEntries).intValue() <= 0
                || !(report.preexistingPoolWeight instanceof Number)
                || ((Number) report.preexistingPoolWeight).longValue() <= 0L
                || report.preexistingEntriesPreserved != true
                || report.startupRequestedEntries != 25
                || report.startupInjectedEntries != 25
                || report.startupWarnings != false
                || report.repeatedInjectedEntries != 0
                || report.repeatedAlreadyPresentEntries != 25
                || report.successfulPlacements != 100
                || report.recordDelta != 100
                || report.recordsAfterPlacement != report.recordsBefore + 100
                || report.completedLoadedBuildings != report.recordsAfterPlacement
                || report.recordsAfterIdle != report.recordsAfterPlacement
                || report.idleSampleTicks != 200
                || report.forcedChunksBefore != report.forcedChunksAfter
                || report.jfrProfile != profileFile.name
                || report.productionArtifactSha256 != sha256OfFile(archive)
                || report.performanceHarnessSha256
                        != sha256OfFiles(performanceHarnessFiles)
                || report.absoluteTimingGateApplied != false
                || timingFields.any {
                    !(report[it] instanceof Number)
                            || !Double.isFinite(((Number) report[it]).doubleValue())
                            || ((Number) report[it]).doubleValue() < 0.0D
                }
                || ((Number) report.placementP50Millis).doubleValue()
                        > ((Number) report.placementP95Millis).doubleValue()
                || ((Number) report.placementP95Millis).doubleValue()
                        > ((Number) report.placementP99Millis).doubleValue()
                || ((Number) report.placementP99Millis).doubleValue()
                        > ((Number) report.placementMaxMillis).doubleValue()
                || ((Number) report.idleP50Mspt).doubleValue()
                        > ((Number) report.idleP95Mspt).doubleValue()
                || ((Number) report.idleP95Mspt).doubleValue()
                        > ((Number) report.idleP99Mspt).doubleValue()
                || ((Number) report.idleP99Mspt).doubleValue()
                        > ((Number) report.idleMaxMspt).doubleValue()) {
            throw new GradleException(
                    'The village-building performance report failed its bounded structural gate')
        }
    }
}

tasks.register('assembleVillageDefenseBuildingEvidence') {
    group = 'build'
    description = 'Binds the current artifact and combined performance evidence without claiming manual review.'
    dependsOn tasks.named('verifyReleaseArtifact'),
            tasks.named('verifyVillageBuildingPerformanceReport'),
            tasks.named('assembleReleaseCandidateEvidence')
    outputs.dir villageBuildingEvidenceDirectory
    outputs.upToDateWhen { false }

    doFirst {
        delete villageBuildingEvidenceDirectory
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File reportDirectory = villageBuildingPerformanceReportDirectory.get().asFile
        File companionManifest = releaseCandidateEvidenceDirectory.get()
                .file('release-candidate.json').asFile
        File outputDirectory = villageBuildingEvidenceDirectory.get().asFile
        outputDirectory.mkdirs()
        List<File> evidence = reportDirectory.listFiles().findAll { it.isFile() }
                .sort { left, right -> left.name <=> right.name }
        Map<String, Object> manifest = [
                schemaVersion: 3,
                mod          : [id: mod_id, version: mod_version],
                artifact     : [file: archive.name, bytes: archive.length(),
                                sha256: sha256OfFile(archive)],
                automatedEvidence: [
                        releaseArtifactGate: 'passed',
                        villageBuildingPerformanceGate: 'passed',
                        combatAndLogisticsPerformanceGate: 'passed',
                        simulatedVillageCandidates: 100,
                        noSelectionCandidates: 100,
                        selectedBuildingCandidates: 100,
                        simultaneousInitializationCandidates: 100,
                        combatAndLogisticsScenarios: 20,
                        performanceHarnessSha256:
                                sha256OfFiles(performanceHarnessFiles),
                        evidence: evidence.collect { file -> [
                                file: file.name,
                                bytes: file.length(),
                                sha256: sha256OfFile(file)
                        ] },
                        companionManifest: [
                                file: 'build/reports/release-candidate/release-candidate.json',
                                bytes: companionManifest.length(),
                                sha256: sha256OfFile(companionManifest)
                        ]
                ],
                separateManualEvidence: [
                        matrix: 'docs/village-defense-buildings-release-matrix.md',
                        status: 'required-before-public-release'
                ]
        ]
        java.nio.file.Files.writeString(
                outputDirectory.toPath().resolve('village-building-release-candidate.json'),
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
                        + System.lineSeparator(),
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

tasks.register('verifyVillageDefenseBuildingsReleaseCandidate') {
    group = 'verification'
    description = 'Runs the automated village-building gate while retaining manual rows separately.'
    if (anyPerformanceGameTestEnabled.get()) {
        doFirst {
            throw new GradleException(
                    'Run this aggregate gate without a performance property after generating performance evidence separately.')
        }
    } else {
        dependsOn tasks.named('runGameTestServer'),
                tasks.named('assembleVillageDefenseBuildingEvidence')
    }

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File manifestFile = villageBuildingEvidenceDirectory.get()
                .file('village-building-release-candidate.json').asFile
        File matrixFile = layout.projectDirectory
                .file('docs/village-defense-buildings-release-matrix.md').asFile
        File companionManifest = releaseCandidateEvidenceDirectory.get()
                .file('release-candidate.json').asFile
        if (!manifestFile.isFile() || !matrixFile.isFile()
                || !companionManifest.isFile()) {
            throw new GradleException('Village-building release evidence is incomplete')
        }
        Object manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        if (manifest.schemaVersion != 3
                || manifest.artifact.sha256 != sha256OfFile(archive)
                || manifest.automatedEvidence.releaseArtifactGate != 'passed'
                || manifest.automatedEvidence.villageBuildingPerformanceGate != 'passed'
                || manifest.automatedEvidence.combatAndLogisticsPerformanceGate != 'passed'
                || manifest.automatedEvidence.simulatedVillageCandidates != 100
                || manifest.automatedEvidence.noSelectionCandidates != 100
                || manifest.automatedEvidence.selectedBuildingCandidates != 100
                || manifest.automatedEvidence.simultaneousInitializationCandidates != 100
                || manifest.automatedEvidence.combatAndLogisticsScenarios != 20
                || manifest.automatedEvidence.performanceHarnessSha256
                        != sha256OfFiles(performanceHarnessFiles)
                || !(manifest.automatedEvidence.evidence instanceof List)
                || manifest.automatedEvidence.evidence.size() != 2
                || manifest.automatedEvidence.companionManifest.sha256
                        != sha256OfFile(companionManifest)
                || manifest.separateManualEvidence.matrix
                        != 'docs/village-defense-buildings-release-matrix.md'
                || manifest.separateManualEvidence.status
                        != 'required-before-public-release') {
            throw new GradleException(
                    'Village-building release manifest is stale or overclaims its evidence')
        }
    }
}

tasks.register('verifyVillageDefenseBuildingManualCandidateIdentity') {
    group = 'verification'
    description = 'Requires the retained manual matrix to name the exact candidate JAR before creating a handoff.'
    dependsOn tasks.named('verifyReleaseArtifact')
    inputs.file layout.projectDirectory.file(
            'docs/village-defense-buildings-release-matrix.md')

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        String matrix = layout.projectDirectory.file(
                'docs/village-defense-buildings-release-matrix.md')
                .asFile.getText('UTF-8')
        String expectedVersion = "- Step 14 candidate version: `${mod_version}`"
        String expectedHash = "- Step 14 candidate JAR SHA-256: `${sha256OfFile(archive)}`"
        if (!matrix.contains(expectedVersion) || !matrix.contains(expectedHash)) {
            throw new GradleException(
                    'Village-building manual handoff refused stale candidate metadata; '
                            + 'update the retained matrix to the exact current version and JAR checksum first')
        }
    }
}

tasks.register('prepareVillageDefenseBuildingManualValidation', Sync) {
    group = 'distribution'
    description = 'Builds an exact-candidate handoff for the remaining natural-generation and compatibility review.'
    dependsOn tasks.named('verifyVillageDefenseBuildingsReleaseCandidate'),
            tasks.named('verifyVillageDefenseBuildingManualCandidateIdentity')

    into villageBuildingManualValidationDirectory
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from('docs/village-defense-buildings-manual-validation.md')
    from('docs/village-defense-buildings-release-matrix.md')
    from(villageBuildingEvidenceDirectory) {
        include 'village-building-release-candidate.json'
    }
    from(releaseCandidateEvidenceDirectory) {
        include 'release-candidate.json'
        rename { 'combat-logistics-release-candidate.json' }
    }

    doLast {
        File archive = destinationDir.toPath()
                .resolve(tasks.named('jar', Jar).get().archiveFileName.get())
                .toFile()
        File villageManifest = destinationDir.toPath()
                .resolve('village-building-release-candidate.json').toFile()
        File companionManifest = destinationDir.toPath()
                .resolve('combat-logistics-release-candidate.json').toFile()
        if (!archive.isFile() || !villageManifest.isFile()
                || !companionManifest.isFile()) {
            throw new GradleException(
                    'Village-building manual-validation handoff is incomplete')
        }
        java.nio.file.Files.writeString(
                destinationDir.toPath().resolve("${archive.name}.sha256"),
                "${sha256OfFile(archive)}  ${archive.name}${System.lineSeparator()}",
                java.nio.charset.StandardCharsets.UTF_8)
    }
}

tasks.register('verifyVillageDefenseBuildingManualChecklist') {
    group = 'verification'
    description = 'Refuses a public package until every village-building manual case passes against the exact JAR.'
    dependsOn tasks.named('verifyReleaseArtifact'),
            tasks.named('verifyVillageDefenseBuildingManualCandidateIdentity')
    inputs.files(
            layout.projectDirectory.file(
                    'docs/village-defense-buildings-manual-validation.md'),
            layout.projectDirectory.file(
                    'docs/village-defense-buildings-release-matrix.md'))

    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        File guideFile = layout.projectDirectory.file(
                'docs/village-defense-buildings-manual-validation.md').asFile
        File matrixFile = layout.projectDirectory.file(
                'docs/village-defense-buildings-release-matrix.md').asFile
        String guide = guideFile.getText('UTF-8')
        String matrix = matrixFile.getText('UTF-8')
        List<String> matrixLines = matrix.readLines()
        List<String> requiredCases = [
                'VBUILD-MANUAL-PALETTE-01',
                'VBUILD-MANUAL-ROAD-01',
                'VBUILD-MANUAL-FUNCTION-01',
                'VBUILD-MANUAL-DIFFICULTY-01',
                'VBUILD-MANUAL-CONFIG-01',
                'VBUILD-MANUAL-LIFECYCLE-01',
                'VBUILD-MANUAL-OLDWORLD-01',
                'VBUILD-MANUAL-COEXIST-01',
                'VBUILD-MANUAL-COMPAT-01',
                'VBUILD-MANUAL-SERVER-01',
                'VBUILD-MANUAL-FREQUENCY-01'
        ]
        List<String> missingCases = []
        List<String> pendingCases = []
        List<String> missingEvidence = []
        List<String> unresolvedRows = matrixLines.findAll { line ->
            line.startsWith('| VBUILD-')
                    && (line.contains('| Partial')
                    || line.contains('| Manual test required'))
        }
        List<String> uncheckedItems = matrixLines.findAll { line ->
            line.startsWith('- [ ]')
        }
        requiredCases.each { id ->
            String row = matrixLines.find { line -> line.startsWith("| ${id} |") }
            if (row == null) {
                missingCases.add(id)
                return
            }
            List<String> cells = row.split('\\|', -1)
                    .collect { cell -> cell.trim() }
            if (cells.size() < 7 || cells[4] != 'Pass') {
                pendingCases.add(id)
            } else if (cells[5].isEmpty() || cells[5] == '—') {
                missingEvidence.add(id)
            }
        }

        String expectedVersion = "- Step 14 candidate version: `${mod_version}`"
        String expectedHash = "- Step 14 candidate JAR SHA-256: `${sha256OfFile(archive)}`"
        List<String> requiredGuideText = [
                './gradlew prepareVillageDefenseBuildingManualValidation',
                '/vgg villagebuildings pools',
                'villageBuildings.enabled=true',
                'newly generated chunks',
                'mixed-mod'
        ]
        if (!matrix.contains(expectedVersion) || !matrix.contains(expectedHash)) {
            throw new GradleException(
                    'Village-building manual results do not identify the exact current version and JAR checksum')
        }
        if (requiredGuideText.any { token -> !guide.contains(token) }) {
            throw new GradleException(
                    'Village-building manual-validation guidance is incomplete')
        }
        if (!missingCases.isEmpty() || !pendingCases.isEmpty()
                || !missingEvidence.isEmpty() || !unresolvedRows.isEmpty()
                || !uncheckedItems.isEmpty()) {
            throw new GradleException(
                    'Village-building manual validation is incomplete: '
                            + "missing=${missingCases}, pending=${pendingCases}, "
                            + "missingEvidence=${missingEvidence}, "
                            + "unresolvedRows=${unresolvedRows.size()}, "
                            + "uncheckedItems=${uncheckedItems.size()}. Complete the retained "
                            + 'matrix against the exact candidate JAR before public packaging.')
        }
    }
}

tasks.register('verifyPublicReleaseIdentity') {
    group = 'verification'
    description = 'Rejects development identities and missing platform-neutral release copy.'

    doLast {
        if (mod_version.endsWith('-dev')) {
            throw new GradleException(
                    "${mod_version} is a development identity; choose the reviewed public version first")
        }
        File releaseNotes = layout.projectDirectory
                .file("docs/releases/${mod_version}.md").asFile
        File uploadGuide = layout.projectDirectory
                .file('docs/curseforge-upload.md').asFile
        File changelogFile = layout.projectDirectory.file('CHANGELOG.md').asFile
        if (!releaseNotes.isFile() || !uploadGuide.isFile()
                || !releaseNotes.getText('UTF-8').contains(
                        "# Villager Guard Gunners ${mod_version}")
                || !uploadGuide.getText('UTF-8').contains(
                        'docs/releases/<version>.md')
                || !changelogFile.getText('UTF-8').contains(
                        "## ${mod_version} - ")) {
            throw new GradleException(
                    "Public release identity ${mod_version} is missing matching changelog, release notes, or upload guidance")
        }
    }
}

